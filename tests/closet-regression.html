<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
html,body{margin:0;background:#1a1a1a}
iframe{border:0;display:block;background:#fff}
#out{color:#9f9;font:11px/1.55 monospace;padding:10px;white-space:pre-wrap;max-width:1200px}
</style></head>
<body>
<iframe id="f" src="/games/bunnycloset.html" width="400" height="880"></iframe>
<div id="out">waiting</div>
<script>
const out = [];
const O = () => document.getElementById('out');
function log(s){ out.push(s); O().textContent = out.join('\n'); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

(async function(){
  window.onerror = function(msg, src, line, col){
    log('!! 运行时错误: ' + msg + ' @' + line + ':' + col);
    O().textContent = 'RESULT ERROR\n' + out.join('\n');
  };
  try{
  const f = document.getElementById('f');
  let w = f.contentWindow;

  for(let i = 0; i < 600 && !(w.__closet && w.__closet.m3()); i++) await sleep(25);
  if(!w.__closet) { log('✗ 游戏没起来'); return; }
  /* 必须等导航完成后再取 document：加载前拿到的还是 about:blank */
  const d = w.document;

  const C = w.__closet, m3 = C.m3();
  let pass = 0, fail = 0;
  const ok = (c, m) => { if(c){ pass++; log('  ✓ ' + m); } else { fail++; log('  ✗ ' + m); } };

  /* 立刻挂上振荡器计数：无头环境下音频时钟不随虚拟时间推进，
     「stepIdx 有没有涨」测不出真相，数实际创建的振荡器才靠谱 */
  let oscCount = 0, oscAtFirstUnlock = -1;
  const AC = (w.AudioContext || w.webkitAudioContext);
  if(AC && AC.prototype){
    const orig = AC.prototype.createOscillator;
    AC.prototype.createOscillator = function(){ oscCount++; return orig.apply(this, arguments); };
  }

  /* ---------------- 工具 ---------------- */
  const cv = d.getElementById('m3');
  function pt(cell){
    const r = cv.getBoundingClientRect(), CS = m3.state().cell;
    return { x: r.left + cell.c * CS + CS / 2, y: r.top + cell.r * CS + CS / 2 };
  }
  function drag(a, b){
    const p1 = pt(a), p2 = pt(b);
    const mk = (t, p, buttons) => new w.PointerEvent(t, {
      bubbles:true, cancelable:true, clientX:p.x, clientY:p.y,
      pointerId:1, isPrimary:true, pointerType:'touch', button:0, buttons:buttons });
    cv.dispatchEvent(mk('pointerdown', p1, 1));
    cv.dispatchEvent(mk('pointermove', p2, 1));
    cv.dispatchEvent(mk('pointerup', p2, 0));
  }
  function settle(){
    let n = 0;
    while(n < 1200){
      const p = m3.state().phase;
      if(p === 'idle' || p === 'end') break;
      m3.tick(1 / 60); n++;
    }
    return n;
  }
  function playRound(maxMoves){
    const seen = { cheer:0, hot:0, spark:0, said:[] };
    for(let i = 0; i < (maxMoves || 60); i++){
      const st = m3.state();
      if(st.phase === 'end' || st.moves <= 0) break;
      const mv = m3.findMove();
      if(!mv) break;
      drag({ r:mv.r1, c:mv.c1 }, { r:mv.r2, c:mv.c2 });
      let n = 0;
      while(n < 1200){
        const p = m3.state().phase;
        if(p === 'idle' || p === 'end') break;
        m3.tick(1 / 60); n++;
        const b = C.buddy();
        if(b.cheer > 0) seen.cheer++;
        if(b.hot > 0) seen.hot++;
        if(b.spark > 0) seen.spark++;
        if(b.say && seen.said.indexOf(b.say) < 0) seen.said.push(b.say);
      }
      settle();
    }
    return seen;
  }
  const $ = sel => d.querySelector(sel);
  const click = sel => { const e = $(sel); if(e) e.click(); return !!e; };

  /* ---------------- 1. 劳作页布局与棋盘 ---------------- */
  log('【1】采胡萝卜页布局');
  C.switchView('work');
  await sleep(120);
  const st0 = m3.state();
  ok(st0.cols === 6 && st0.rows === 7, '棋盘是 6×7（' + st0.cols + '×' + st0.rows + '）');
  ok(st0.moves === 20 && st0.phase === 'idle', '开局 20 步、可操作');
  const vw = d.getElementById('viewWork');
  const vr = vw.getBoundingClientRect();
  const actR = d.querySelector('#viewWork .actions').getBoundingClientRect();
  const navTop = d.querySelector('.nav').getBoundingClientRect().top;
  ok(actR.height > 0 && actR.bottom <= navTop + 1,
     '底栏按钮没被挤出屏幕（actions 底 ' + Math.round(actR.bottom) + ' ≤ nav 顶 ' + Math.round(navTop) + '）');
  let contentH = 8 * 3;
  for(const el of vw.children) contentH += el.getBoundingClientRect().height;
  ok(contentH <= vr.height + 1,
     '采胡萝卜页内容总高 ' + Math.round(contentH) + ' 没超出一屏 ' + Math.round(vr.height) + '（棋盘自动缩到放得下）');
  ok(m3.state().cell * 7 + 20 <= vr.height, '棋盘高度按可视区自适应（格边长 ' + m3.state().cell + 'px）');
  const buddyBox = d.getElementById('buddy').getBoundingClientRect();
  ok(buddyBox.width > 40 && buddyBox.height > 40,
     '兔子画布有实际尺寸（' + Math.round(buddyBox.width) + '×' + Math.round(buddyBox.height) + '）');
  ok(d.querySelector('.workTip') === null, '旧的静态提示行已移除');
  /* 未开始时也要把盘面画出来，否则玩家进来只看到一块空白 */
  const mcv = d.getElementById('m3'), mg = mcv.getContext('2d');
  const mp = mg.getImageData(0, 0, mcv.width, mcv.height).data;
  let mfilled = 0;
  for(let i = 3; i < mp.length; i += 4) if(mp[i] > 8) mfilled++;
  ok(mfilled > 5000, '还没开始采胡萝卜，棋盘就已经摆好了（非透明像素 ' + mfilled + ' 个）');

  /* ---------------- 2. 连击横幅有样式了 ---------------- */
  log('');
  log('【2】连击横幅');
  const comboStyle = w.getComputedStyle(d.getElementById('combo'));
  ok(comboStyle.position === 'absolute', '连击横幅是绝对定位，不会再撑开布局');
  ok(comboStyle.opacity === '0', '默认透明，只在连击时出现');

  /* ---------------- 3. 没开始就点棋盘 ---------------- */
  log('');
  log('【3】未开始时的点击');
  const before3 = m3.state().moves;
  const mv0 = m3.findMove();
  drag({ r:mv0.r1, c:mv0.c1 }, { r:mv0.r2, c:mv0.c2 });
  settle();
  ok(m3.state().moves === before3, '没花体力就点棋盘，不会白白消掉（步数仍是 ' + before3 + '）');
  ok(C.buddy().say.indexOf('按钮') >= 0, '兔子会撒娇地提示：' + C.buddy().say);
  /* 第一次真实交互会解锁音频：这一刻 BGM 应该立刻合成出第一小节 */
  await sleep(200);
  oscAtFirstUnlock = oscCount;

  /* ---------------- 4. 弹层关闭按钮 ---------------- */
  log('');
  log('【4】弹层的关闭按钮');
  for(const name of ['task', 'sign', 'wheel', 'sound']){
    C.sheets[name]();
    const opened = C.sheetOpen();
    const btn = $('#sheet [data-close]');
    const label = btn ? btn.textContent.trim() : '(没有)';
    if(btn) btn.click();
    ok(opened && !C.sheetOpen(), name + ' 弹层点「' + label + '」能关掉');
  }

  /* ---------------- 5. 打一局，看兔子反应与结算 ---------------- */
  log('');
  log('【5】一局采胡萝卜');
  const c0 = C.S.carrots;
  C.startRound();
  await sleep(60);
  const seen = playRound();

  ok(seen.cheer > 0, '消除时兔子有反应（触发 ' + seen.cheer + ' 次采样）');
  ok(seen.said.length >= 3, '兔子会随情况说不同的台词（收集到 ' + seen.said.length + ' 种）');
  const cute = seen.said.filter(s => /谢谢你|连着采到|一下这么多|已经|乖乖/.test(s));
  ok(cute.length > 0, '台词是撒娇口吻，例如：' + (cute[0] || '（没采到）'));
  ok(seen.hot > 0 || seen.spark > 0, '出现过兴奋/撒星星的大反应');
  const cheerBefore = C.buddy().cheer;
  C.tickBuddy(1.2);
  ok(C.buddy().cheer < cheerBefore || cheerBefore === 0, '欢呼状态会随时间衰减（由主循环驱动）');
  const bcv = d.getElementById('buddy'), bg = bcv.getContext('2d');
  const px = bg.getImageData(0, 0, bcv.width, bcv.height).data;
  let solid = 0;
  for(let i = 3; i < px.length; i += 4) if(px[i] > 8) solid++;
  ok(solid > 300, '兔子确实画在画布上（非透明像素 ' + solid + ' 个）');

  C.buddyCheer({ combo:5, cleared:6, gain:30 });
  C.tickBuddy(0.016);
  const bHot = C.buddy();
  ok(bHot.hot > 0 && bHot.spark > 0, '五连击会触发大反应（hot + ' + bHot.spark + ' 颗星星）');
  ok(bHot.say.indexOf('连击') >= 0 && bHot.hotClass, '大反应时气泡变红：' + bHot.say);

  const gained1 = C.state().round.gained;
  const total1 = m3.state().cleared;
  ok(C.sheetOpen(), '步数用完后弹出了结算面板');
  const txt = C.sheetText();
  ok(txt.indexOf('undefined') < 0, '结算面板里没有 undefined（实际文案已修好）');
  ok(txt.indexOf('这一局结束了') >= 0, '结算面板标题正确');
  ok(txt.indexOf(String(total1)) >= 0 && txt.indexOf(String(gained1)) >= 0,
     '结算数字正确：消掉 ' + total1 + ' 个、收获 ' + gained1 + ' 个');

  /* 结算卡片与小游戏里的「盲盒」章节共用了 .box 这个类名，
     盲盒那套固定 170×170 + 抖动动画曾经把结算卡片整个带歪 */
  const rbox = d.querySelector('#sheet .resultRow .box');
  const rbr = rbox.getBoundingClientRect();
  const rsm = rbox.querySelector('small').getBoundingClientRect();
  const rbb = rbox.querySelector('b').getBoundingClientRect();
  const ranim = w.getComputedStyle(rbox).animationName;
  ok(rbr.height < 90 && rbr.height > 30,
     '结算卡片高度正常（' + Math.round(rbr.height) + 'px，不是被撑成的 170px）');
  ok(rbb.top >= rsm.bottom - 2, '结算卡片里标签和数字是上下排列的');
  ok(ranim === 'none', '结算卡片没继承盲盒的抖动动画（animation-name=' + ranim + '）');

  /* ---------------- 6. 收下胡萝卜 ---------------- */
  log('');
  log('【6】收下胡萝卜');
  const c1 = C.S.carrots;
  click('#takeCarrot');
  await sleep(30);
  ok(!C.sheetOpen(), '面板已关闭');
  ok(Math.round(C.S.carrots - c1) === gained1, '胡萝卜 +' + gained1 + '（实际 +' + Math.round(C.S.carrots - c1) + '）');

  /* ---------------- 7. 关掉面板也不能吞掉收获 ---------------- */
  log('');
  log('【7】用「先去忙别的」关掉结算');
  C.startRound();
  await sleep(60);
  playRound();
  const g2 = C.state().round.gained;
  const c2 = C.S.carrots;
  const closed = click('#sheet [data-close]');
  await sleep(30);
  ok(closed && !C.sheetOpen(), '「先去忙别的」能关掉结算面板');
  ok(Math.round(C.S.carrots - c2) === g2, '关掉面板也照样收下 ' + g2 + ' 个胡萝卜（实际 +' +
     Math.round(C.S.carrots - c2) + '）');

  /* ---------------- 8. 转盘关掉后不该自己弹回来 ---------------- */
  log('');
  log('【8】转盘');
  C.sheets.wheel();
  await sleep(40);
  const spun = click('#spinFree');
  await sleep(60);
  click('#sheet [data-close]');
  const closedAt = Date.now();
  ok(!C.sheetOpen(), '转的过程中可以关掉转盘');
  await sleep(5200);
  ok(!C.sheetOpen(), '等到转完，转盘面板不会自己弹回来（修好了）');

  /* ---------------- 9. 音乐 ---------------- */
  log('');
  log('【9】音乐');
  const a1 = w.GameAudio.debug();
  ok(a1.state === 'running', '音频上下文已启动（state=' + a1.state + '）');
  ok(a1.musicOn === true && a1.running === true, '八音盒 BGM 已开始调度');
  ok(a1.stepIdx >= 1, 'BGM 已经排过音符（step=' + a1.stepIdx + '）');
  ok(oscAtFirstUnlock >= 4,
     '第一次交互就合成出 ' + oscAtFirstUnlock + ' 个音（和声垫与低音），音乐是真的在响');
  C.sheets.sound();
  await sleep(40);
  ok(!!$('#swMusic') && $('#swMusic').classList.contains('on'), '声音面板里音乐开关默认是开的');
  ok(!!$('#swSfx') && $('#swSfx').classList.contains('on'), '音效开关默认是开的');
  click('#sheet [data-close]');
  await sleep(60);
  /* 关掉音乐要真的停 */
  C.sheets.sound();
  await sleep(30);
  click('#swMusic');
  await sleep(120);
  const a3 = w.GameAudio.debug();
  ok(a3.musicOn === false && a3.running === false, '音乐开关能关掉，调度器也停了');
  C.sheets.sound();
  await sleep(30);
  click('#swMusic');
  await sleep(120);
  const a4 = w.GameAudio.debug();
  ok(a4.musicOn === true && a4.running === true, '再打开能恢复播放');
  const before4 = oscCount;
  C.sheets.sound();
  await sleep(30);
  click('#swSfx');
  await sleep(60);
  click('#swSfx');
  await sleep(60);
  ok(oscCount > before4, '音效开关也能正常出声（新增 ' + (oscCount - before4) + ' 个音）');
  click('#sheet [data-close]');

  /* ---------------- 10. 不同屏幕尺寸下的排版 ---------------- */
  log('');
  log('【10】不同尺寸的排版');
  for(const [wpx, hpx] of [[360, 780], [390, 844], [430, 932]]){
    f.width = wpx; f.height = hpx;
    await sleep(200);
    const cellNatural = m3.state().cell;
    /* 无头环境下改 iframe 尺寸不一定触发 resize 事件，显式派发一次，
       验证的才是游戏自己的重算逻辑 */
    w.dispatchEvent(new w.Event('resize'));
    await sleep(250);
    const cellAfter = m3.state().cell;
    const top = d.querySelector('.top');
    const tr = top.getBoundingClientRect();
    let wrapped = [];
    for(const pill of top.querySelectorAll('.pill')){
      const sm = pill.querySelector('small'), b = pill.querySelector('b');
      if(!sm || !b) continue;
      const r1 = sm.getBoundingClientRect(), r2 = b.getBoundingClientRect();
      if(Math.abs((r1.top + r1.height / 2) - (r2.top + r2.height / 2)) > 6) wrapped.push(sm.textContent);
    }
    const lastR = top.lastElementChild.getBoundingClientRect();
    const vw2 = d.getElementById('viewWork');
    let contentH2 = 8 * 3;
    for(const el of vw2.children) contentH2 += el.getBoundingClientRect().height;
    const boardBottom = d.querySelector('#viewWork .actions').getBoundingClientRect().bottom;
    const navT = d.querySelector('.nav').getBoundingClientRect().top;
    const bud = d.getElementById('buddy').getBoundingClientRect();
    const okAll = wrapped.length === 0 && lastR.right <= tr.right + 1 &&
                  contentH2 <= vw2.getBoundingClientRect().height + 1 &&
                  boardBottom <= navT + 1 && bud.height >= 80 &&
                  d.documentElement.clientWidth === wpx;
    ok(okAll, wpx + '×' + hpx + ' 排版正常：顶栏不换行 ' + (wrapped.length === 0) +
       '、右侧按钮不出界 ' + (lastR.right <= tr.right + 1) +
       '、内容 ' + Math.round(contentH2) + '≤' + Math.round(vw2.getBoundingClientRect().height) +
       '、底栏 ' + Math.round(boardBottom) + '≤' + Math.round(navT) +
       '、兔子 ' + Math.round(bud.width) + '×' + Math.round(bud.height) +
       '、格边长 ' + cellNatural + '→' + cellAfter + 'px');
  }

  /* ---------------- 11. 用词 · 兔子着装 · 体力补给 ---------------- */
  log('');
  log('【11】用词 · 兔子着装 · 体力补给');

  const pageHtml = d.documentElement.outerHTML;
  ok(pageHtml.indexOf('劳作') < 0, '界面上不再出现「劳作」这个词');
  ok(pageHtml.indexOf('采胡萝卜') >= 0, '换成了「采胡萝卜」');
  ok(pageHtml.indexOf('辛苦') < 0 && pageHtml.indexOf('加油') < 0,
     '台词里没有会让人觉得在使唤人的说法');

  /* 兔子穿的是玩家在衣橱里配的那一套 */
  const bcv2 = d.getElementById('buddy');
  function buddyHash(){
    C.tickBuddy(0.016);
    const u = bcv2.toDataURL();
    let h = 0;
    for(let i = 0; i < u.length; i++) h = (h * 31 + u.charCodeAt(i)) | 0;
    return h;
  }
  C.S.worn.hat = null; C.S.worn.cloth = null; C.S.worn.acc = null;
  const bare = buddyHash();
  C.S.worn.hat = 'h_crown'; C.S.worn.cloth = 'c_overall';
  const dressed = buddyHash();
  ok(bare !== dressed, '换上衣橱里的搭配后围观画布确实变了（兔子穿上衣服了）');
  C.S.worn.acc = 'a_wing';
  const winged = buddyHash();
  ok(winged !== dressed, '再加「小翅膀」也画得出来（翅膀横向最宽，没被画布切掉）');

  /* 比例：围观条让出高度，棋盘吃满宽度 */
  const bsz = bcv2.getBoundingClientRect();
  const mcv2 = d.getElementById('m3');
  const cell = m3.state().cell;
  ok(bsz.height >= 80 && bsz.height <= 95,
     '围观条高度合适（' + Math.round(bsz.height) + 'px）');
  ok(bsz.width <= 60, '围观画布贴着兔子收窄（' + Math.round(bsz.width) + 'px，之前 70 里兔子只占 38）');
  ok(cell >= 52, '棋盘没被围观条挤小（格边长 ' + cell + 'px）');

  /* 体力补给：6 个广告点位里唯一原本没有入口的那个 */
  const enPill = d.getElementById('btnEnergy');
  ok(!!enPill && enPill.tagName === 'BUTTON', '体力胶囊是按钮，点得动');
  C.S.energy = 0; C.S.energyAdUsed = 0; C.render();
  enPill.click();
  await sleep(80);
  const eInfo = C.energy();
  ok(C.sheetOpen() && C.sheetText().indexOf('体力') >= 0, '点体力胶囊能打开补给面板');
  ok(C.sheetText().indexOf('分钟') >= 0, '面板里说明了自动恢复时间：' + C.sheetText().slice(2, 24));
  const eBefore = C.S.energy;
  ok(!!d.getElementById('energyAd'), '面板里有「看广告 +' + eInfo.add + ' 体力」按钮');
  d.getElementById('energyAd').click();
  await sleep(150);
  ok(C.S.energy === Math.min(5, eBefore + eInfo.add),
     '看完广告体力 +' + eInfo.add + '（' + eBefore + ' → ' + C.S.energy + '）');
  ok(C.energy().used === 1, '补充次数记了账（今天已用 ' + C.energy().used + ' / ' + eInfo.max + '）');
  C.closeSheet();

  /* 次数用尽 + 体力不足时，要当场给出口而不是干弹一句提示 */
  C.S.energy = 0; C.S.energyAdUsed = 99;
  C.startRound();
  await sleep(80);
  ok(C.sheetOpen() && C.sheetText().indexOf('体力') >= 0,
     '体力不足时直接打开补给面板，而不是只弹一句没出口的提示');
  ok(C.sheetText().indexOf('用完') >= 0, '次数用尽时说清楚了');
  C.closeSheet();

  /* ---------------- 12. 棋子辨识度 ---------------- */
  log('');
  log('【12】棋子辨识度（三消的命门）');

  const pal = C.palette();
  function rgb(hex){
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  }
  function dist(a, b){
    const A = rgb(a), B = rgb(b);
    return Math.round(Math.sqrt((A[0]-B[0])**2 + (A[1]-B[1])**2 + (A[2]-B[2])**2));
  }
  ok(pal.length === 5, '棋盘有 5 种棋子（' + pal.length + ' 种萝卜）');

  let worst = { d: 999, pair: '' };
  for(let i = 0; i < pal.length; i++){
    for(let j = i + 1; j < pal.length; j++){
      const d = dist(pal[i].main, pal[j].main);
      if(d < worst.d) worst = { d: d, pair: pal[i].main + ' / ' + pal[j].main };
    }
  }
  ok(worst.d >= 70, '任意两种棋子颜色都拉得开（最接近的一对差 ' + worst.d + '：' + worst.pair + '）');

  /* 浅色棋子（米白的白萝卜）和浅茶色底格本来就靠不近，
     它立住轮廓靠的是深色的描边而不是填充色，所以这里测的是
     「本体色和描边色里，至少有一个和底格分得开」——
     这才是这种棋子真正的可辨性来源 */
  const CELL_BG = '#F3E8D7';
  let worstTile = { d: 999, which: '', by: '' };
  pal.forEach(function(f){
    const dm = dist(f.main, CELL_BG), dd = dist(f.dark, CELL_BG);
    const best = Math.max(dm, dd);
    if(best < worstTile.d) worstTile = { d: best, which: f.main, by: dm >= dd ? '本体色' : '描边色' };
  });
  ok(worstTile.d >= 60,
     '每种棋子都分得出来（最难的一种 ' + worstTile.which + ' 靠' + worstTile.by +
     '，与底格差 ' + worstTile.d + '）');

  /* 粒子颜色单独给过 pop 的，也要保证看得见 */
  let badPop = pal.filter(function(f){ return dist(f.pop, CELL_BG) < 50; });
  ok(badPop.length === 0, '消除粒子的颜色在棋盘上也看得见');

  /* 五种必须真的画得出来（不同 kind 渲染出的像素不同） */
  const seenKind = new Set();
  const boardKinds = m3.state().grid;
  for(const row of boardKinds) for(const k of row) seenKind.add(k);
  ok(seenKind.size >= 4, '盘面确实在随机用多种棋子（实际出现 ' + seenKind.size + ' 种）');

  log('');
  log('========== 通过 ' + pass + ' 项，失败 ' + fail + ' 项 ==========');
  O().textContent = 'RESULT ' + (fail === 0 ? 'ALLPASS' : 'FAIL') + ' ' + pass + '/' + (pass + fail) + '\n' + out.join('\n');
  }catch(e){
    log('!! 异常: ' + (e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e));
    O().textContent = 'RESULT ERROR\n' + out.join('\n');
  }
})();
</script>

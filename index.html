<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#FDF3E5">
<title>兔子小游戏 · 合集</title>
<link rel="stylesheet" href="shared/theme.css">
<style>
/* ============================================================
   大厅（开始界面）专属样式
   游戏卡片全部由下方 GAMES 数组渲染，加新游戏只需改数据。
   ============================================================ */

/* 顶部标题卡 */
.masthead{position:relative;width:100%;padding:15px 18px 13px;text-align:center;
  background:rgba(255,253,248,.94);border:2px solid var(--line);border-radius:var(--radius);
  box-shadow:4px 5px 0 var(--tap),0 10px 26px rgba(150,118,92,.13);transform:rotate(-.5deg)}
/* 兔子是 absolute 挑在卡片上方的，顶部要留出足够空间，否则耳朵会被裁掉 */
.page{padding-top:calc(46px + env(safe-area-inset-top))}
.masthead:after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;
  background:rgba(196,160,128,.30);transform:rotate(.5deg)}
.masthead .bunnyBox{position:absolute;left:12px;top:-32px;width:66px}
.masthead .bunnyBox svg{filter:drop-shadow(2px 3px 0 rgba(170,140,112,.22))}
.masthead .name{font-size:24px;font-weight:800;letter-spacing:3px;color:#4E3E36}
.masthead .sub{margin-top:3px;font-size:11.5px;color:var(--ink3);letter-spacing:.3px}

/* 继续游戏 */
.resume{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;
  background:rgba(255,253,248,.9);border:2px solid #EBCBD2;border-radius:16px;
  box-shadow:3px 3px 0 rgba(200,140,155,.14);transform:rotate(.3deg)}
.resume:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(200,140,155,.14)}
.resume .rIcon{width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:#FFF0F3;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--pink-d)}
.resume .rText{flex:1;min-width:0;text-align:left}
.resume .rText b{display:block;font-size:13.5px;color:#5A4B42}
.resume .rText small{display:block;font-size:10.5px;color:var(--ink3);margin-top:1px}
.resume .rGo{flex:0 0 auto;font-size:11px;color:#B07A88;background:#FFF0F3;
  border-radius:999px;padding:4px 10px}

/* 分类筛选 */
.filters{width:100%;display:flex;gap:7px;justify-content:center}
.filters button{border:1.5px solid var(--line);background:rgba(255,253,248,.8);
  border-radius:999px;padding:6px 15px;font-size:12px;color:var(--ink3);cursor:pointer}
.filters button.on{color:#B07A88;border-color:#EBCBD2;background:rgba(255,240,242,.95);font-weight:600}

/* 游戏卡片网格 */
.grid{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.gcard{position:relative;display:flex;flex-direction:column;gap:8px;padding:11px 11px 10px;
  text-align:left;background:rgba(255,253,248,.95);border:2px solid var(--line);
  border-radius:18px;box-shadow:3px 4px 0 var(--tap);cursor:pointer;
  transform:rotate(-.35deg);transition:transform .1s,box-shadow .1s}
.gcard:nth-child(even){transform:rotate(.4deg)}
.gcard:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tap)}
.gcard .thumb{height:74px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  overflow:hidden}
.gcard .thumb svg{display:block}
.gcard h3{margin:0;font-size:15px;color:#4E3E36;letter-spacing:.5px}
.gcard .desc{margin:0;font-size:11px;color:var(--ink3);line-height:1.5;min-height:33px}
.gcard .meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tagchip{font-size:9.5px;padding:2px 7px;border-radius:999px;background:#F4EDE3;color:#9C8878}
.tagchip.relax{background:#E7F4EE;color:#4C9179}
.tagchip.brain{background:#FDECEF;color:#B2707E}
.bestChip{margin-left:auto;font-size:10px;color:#B07A58;background:#FBE7D4;
  border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.gcard.soon{opacity:.6;border-style:dashed;cursor:default;box-shadow:none}
.gcard.soon:active{transform:rotate(-.35deg)}

.footNote{width:100%;text-align:center;font-size:10.5px;color:#C0AC99;letter-spacing:.6px;line-height:1.7}

/* 游戏少的时候用来撑住下半屏，游戏多了会自动往下排 */
.moreNote{width:100%;display:flex;align-items:center;gap:9px;color:#C0AC99;font-size:11px}
.moreNote:before,.moreNote:after{content:"";flex:1;height:1px;background:rgba(196,160,128,.35)}
.moreNote span{white-space:nowrap}
/* 开关和页脚吸在底部，避免上半屏挤满、下半屏空荡 */
.footBlock{width:100%;margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:9px}
</style>
</head>
<body>

<main class="page">
  <h1 class="sr-only">兔子小游戏合集</h1>

  <header class="masthead">
    <div class="tape"></div>
    <div class="bunnyBox" id="bunnyTop"></div>
    <div class="name">兔子小游戏</div>
    <div class="sub">随手玩两把，放松一下</div>
  </header>

  <div id="resumeSlot"></div>

  <nav class="filters" id="filters" aria-label="按类型筛选">
    <button data-f="all" class="on">全部</button>
    <button data-f="relax">放松</button>
    <button data-f="brain">烧脑</button>
  </nav>

  <section class="grid" id="grid" aria-label="游戏列表"></section>

  <p class="moreNote"><span>更多小游戏在做啦</span></p>

  <div class="footBlock">
    <div class="toggles">
      <button class="tg" id="tgMusic">♪ 音乐</button>
      <button class="tg" id="tgSfx">♬ 音效</button>
    </div>
    <p class="footNote">点开即玩，无需下载<br>记录保存在本机</p>
  </div>
</main>

<script src="shared/store.js"></script>
<script src="shared/audio.js"></script>
<script src="shared/bunny.js"></script>
<script src="shared/theme.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   游戏清单 —— 加新游戏只改这里
   ------------------------------------------------------------
   id     唯一标识，也是打分存档的键（Store.best(id)）
   name   卡片标题
   desc   一句话说明，尽量口语、别超过 14 个字
   tags   标签，'relax' = 放松 / 'brain' = 烧脑
   url    游戏文件路径，相对本页
   ready  false 会显示成「筹备中」的虚线卡片
   accent 卡片缩略图底色
   unit   最高纪录的单位，显示在卡片右下角
   icon   缩略图内容，见下方 ICONS
   ============================================================ */
var ICONS = {
  /* 最后一格：小棋盘 + 一条粉色路径 */
  grid:
    '<svg viewBox="0 0 72 72" width="62" height="62">' +
      '<rect x="6" y="6" width="60" height="60" rx="12" fill="#FFF6E8" stroke="#E7D8C6" stroke-width="2"/>' +
      '<g>' +
        '<rect x="13" y="13" width="14" height="14" rx="4" fill="#F5DFE4"/>' +
        '<rect x="29" y="13" width="14" height="14" rx="4" fill="#FFEFAE" stroke="#E0B23E" stroke-width="1.5"/>' +
        '<rect x="45" y="13" width="14" height="14" rx="4" fill="#FBDCB2"/>' +
        '<rect x="13" y="29" width="14" height="14" rx="4" fill="#F5DFE4"/>' +
        '<rect x="29" y="29" width="14" height="14" rx="4" fill="#E68B9C" stroke="#C4697B" stroke-width="1.5"/>' +
        '<rect x="45" y="29" width="14" height="14" rx="4" fill="#E7DCCC"/>' +
        '<rect x="13" y="45" width="14" height="14" rx="4" fill="#E7DCCC"/>' +
        '<rect x="29" y="45" width="14" height="14" rx="4" fill="#F5DFE4"/>' +
        '<rect x="45" y="45" width="14" height="14" rx="4" fill="#FFEFAE" stroke="#E0B23E" stroke-width="1.5"/>' +
      '</g>' +
      '<path d="M20 20 L20 36 L36 36 L36 52 L52 52" fill="none" stroke="#D68B9C" ' +
        'stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>' +
    '</svg>'
};

var GAMES = [
  {
    id:'lastcell',
    name:'最后一格',
    desc:'走一条不能回头的路，别把自己困住',
    tags:['brain'],
    url:'games/lastcell.html',
    ready:true,
    accent:'#FDEFF2',
    unit:'步',
    icon:ICONS.grid
  },
  {
    id:'next',
    name:'下一个游戏',
    desc:'正在挑一个不太费脑的玩法',
    tags:['relax'],
    url:'',
    ready:false,
    accent:'#F1F6F3',
    unit:'',
    icon:''
  }
];

var gridEl = document.getElementById('grid');
var resumeSlot = document.getElementById('resumeSlot');
var filter = 'all';

document.getElementById('bunnyTop').innerHTML = Bunny.svg('idle', 'hub');

/* ---------- 渲染卡片 ---------- */
function render(){
  var list = GAMES.filter(function(g){
    return filter === 'all' || (g.tags || []).indexOf(filter) >= 0;
  });

  var html = list.map(function(g){
    var best = Store.best(g.id);
    var bestChip = (g.ready && best > 0)
      ? '<span class="bestChip">' + best + g.unit + '</span>' : '';
    var tagHtml = (g.tags || []).map(function(t){
      var cls = t === 'relax' ? 'relax' : t === 'brain' ? 'brain' : '';
      var label = t === 'relax' ? '放松' : t === 'brain' ? '烧脑' : t;
      return '<span class="tagchip ' + cls + '">' + label + '</span>';
    }).join('');

    var thumb = g.ready
      ? g.icon
      : '<div style="font-size:26px;color:#C0AC99;line-height:1;display:flex;flex-direction:column;' +
        'align-items:center;gap:2px">' + Bunny.head('soon', 44) + '</div>';

    return '<article class="gcard' + (g.ready ? '' : ' soon') + '"' +
      ' data-id="' + g.id + '"' + (g.ready ? '' : ' aria-disabled="true"') + '>' +
        '<div class="thumb" style="background:' + g.accent + '">' + thumb + '</div>' +
        '<h3>' + g.name + '</h3>' +
        '<p class="desc">' + g.desc + '</p>' +
        '<div class="meta">' + tagHtml + bestChip + '</div>' +
      '</article>';
  }).join('');

  gridEl.innerHTML = html;

  Array.prototype.forEach.call(gridEl.querySelectorAll('.gcard'), function(card){
    card.addEventListener('click', function(){
      var id = card.dataset.id;
      var g = null;
      for(var i = 0; i < GAMES.length; i++){ if(GAMES[i].id === id) g = GAMES[i]; }
      if(!g || !g.ready || !g.url) return;
      GameAudio.unlock(); GameAudio.sfx('ui');
      setTimeout(function(){ location.href = g.url; }, 120);
    });
  });
}

/* ---------- 继续游戏 ---------- */
function renderResume(){
  var lastId = Store.get('last', null);
  var g = null;
  for(var i = 0; i < GAMES.length; i++){ if(GAMES[i].id === lastId) g = GAMES[i]; }
  if(!g || !g.ready){ resumeSlot.innerHTML = ''; return; }

  var best = Store.best(g.id);
  var plays = Store.plays(g.id);
  resumeSlot.innerHTML =
    '<div class="resume" id="resumeBtn" role="button" tabindex="0">' +
      '<span class="rIcon">▶</span>' +
      '<span class="rText"><b>继续 ' + g.name + '</b>' +
      '<small>玩过 ' + plays + ' 次' + (best > 0 ? ' · 最好成绩 ' + best + g.unit : '') + '</small></span>' +
      '<span class="rGo">进去</span>' +
    '</div>';

  var btn = document.getElementById('resumeBtn');
  function go(){
    GameAudio.unlock(); GameAudio.sfx('ui');
    setTimeout(function(){ location.href = g.url; }, 120);
  }
  btn.addEventListener('click', go);
  btn.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' ') go(); });
}

/* ---------- 筛选 ---------- */
Array.prototype.forEach.call(document.querySelectorAll('#filters button'), function(b){
  b.addEventListener('click', function(){
    filter = b.dataset.f;
    Array.prototype.forEach.call(document.querySelectorAll('#filters button'), function(x){
      x.classList.toggle('on', x === b);
    });
    GameAudio.unlock(); GameAudio.sfx('ui');
    render();
  });
});

/* ---------- 声音开关 ---------- */
var tgMusic = document.getElementById('tgMusic');
var tgSfx = document.getElementById('tgSfx');

function syncToggles(){
  tgMusic.classList.toggle('on', GameAudio.musicOn());
  tgSfx.classList.toggle('on', GameAudio.sfxOn());
}
tgMusic.addEventListener('click', function(){
  GameAudio.unlock();
  GameAudio.setMusic(!GameAudio.musicOn());
  syncToggles();
  GameAudio.sfx('ui');
});
tgSfx.addEventListener('click', function(){
  GameAudio.unlock();
  GameAudio.setSfx(!GameAudio.sfxOn());
  syncToggles();
  GameAudio.sfx('ui');
});

/* ---------- 启动 ---------- */
GameAudio.autoUnlock();
syncToggles();
renderResume();
render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#FDF3E5">
<title>兔子的衣橱 · 兔子小游戏</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
/* ============================================================
   兔子的衣橱 —— 换装 + 收集 + 养成
   四个驱动力咬合：放置产出 → 开盲盒 → 换装 → 生成形象卡分享
   兔子、服装、背景全部用 Canvas 代码绘制，没有任何图片文件
   ============================================================ */

.app{position:relative;z-index:1;width:min(100vw,460px);margin:0 auto;height:100vh;
  display:flex;flex-direction:column;padding:calc(46px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
  gap:8px;overflow:hidden}

/* 顶栏：两个数额胶囊 + 两个图标按钮要挤在一行里，全部禁止换行 */
.top{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.pill{background:rgba(255,253,248,.95);border:2px solid var(--line);border-radius:14px;
  padding:4px 9px;box-shadow:2px 3px 0 var(--tap);display:flex;align-items:baseline;gap:4px;
  white-space:nowrap;min-width:0;font-family:inherit;text-align:left}
/* 体力还差一点、且今天还有补充次数时，给个淡绿底暗示「这里可以点」 */
.pill.en{cursor:pointer}
.pill.en.can{border-color:#A8D8C0}
.pill small{font-size:9.5px;color:var(--ink3);white-space:nowrap}
.pill b{font-size:16px;color:#D8863C;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .rate{font-size:9px;color:#B99A7C;white-space:nowrap}
.top .spacer{flex:1;min-width:2px}
.iconBtn{width:32px;height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--line);border-radius:12px;background:rgba(255,253,248,.95);
  color:#7A6353;font-size:15px;box-shadow:2px 3px 0 var(--tap);cursor:pointer;text-decoration:none}
.top .backBtn{width:32px;height:32px;flex:0 0 32px;border-radius:12px;font-size:17px}

/* 展示台 */
.stage{position:relative;flex:1 1 auto;min-height:0;border-radius:20px;overflow:hidden;
  border:2px solid var(--line);box-shadow:4px 5px 0 var(--tap),0 10px 24px rgba(150,118,92,.12)}
#stage{display:block;width:100%;height:100%}
.stageTag{position:absolute;left:10px;bottom:8px;font-size:10.5px;color:rgba(80,60,48,.62);
  background:rgba(255,253,248,.8);border-radius:999px;padding:3px 9px;backdrop-filter:blur(3px)}

/* 分类 */
.tabs{display:flex;gap:6px;flex:0 0 auto}
.tabs button{flex:1;border:1.5px solid var(--line);background:rgba(255,253,248,.86);
  border-radius:12px;padding:7px 0;font-size:12px;color:var(--ink3);cursor:pointer;font-family:inherit}
.tabs button.on{color:#C4697B;border-color:#EBCBD2;background:rgba(255,240,242,.96);font-weight:600}
.tabs button i{font-style:normal;font-size:9.5px;opacity:.7;margin-left:3px}

/* 道具格 */
.grid{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;
  max-height:34vh;overflow-y:auto;padding:2px 1px 4px;-webkit-overflow-scrolling:touch}
.item{position:relative;aspect-ratio:1;border:2px solid var(--line);border-radius:14px;
  background:rgba(255,253,248,.9);cursor:pointer;overflow:hidden;
  box-shadow:2px 3px 0 var(--tap);transition:transform .1s}
.item:active{transform:scale(.95)}
.item canvas{display:block;width:100%;height:100%}
.item.locked{background:rgba(240,236,229,.9);border-style:dashed;cursor:default}
.item.worn{border-color:var(--pink);background:rgba(255,241,244,.95);
  box-shadow:0 0 0 2px rgba(230,139,156,.28),2px 3px 0 var(--tap)}
.item .rar{position:absolute;right:4px;top:3px;font-size:9px;font-weight:800;
  border-radius:999px;padding:1px 5px;background:rgba(255,255,255,.85)}
.item .nm{position:absolute;left:0;right:0;bottom:0;font-size:9px;text-align:center;
  color:#7C6A5C;background:rgba(255,253,248,.86);padding:1px 0}

/* 底部操作 */
.actions{display:flex;gap:8px;flex:0 0 auto}
.btn{flex:1;border:1.5px solid #C9AE93;border-radius:999px;padding:10px 6px;background:rgba(255,253,248,.96);
  color:#6B5648;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  box-shadow:3px 3px 0 var(--tap);line-height:1.25;position:relative}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tap)}
.btn[disabled]{opacity:.45;box-shadow:none;cursor:default}
.btn.primary{background:linear-gradient(180deg,#F2A0B0,var(--pink));border-color:var(--pink-d);color:#fff}
.btn.gold{background:linear-gradient(180deg,#FFD98A,#F2B84E);border-color:#C89030;color:#7A5210}
.odds{flex:0 0 auto;width:100%;text-align:center;font-size:10px;color:#C0AC99;letter-spacing:.4px;margin-top:-2px}
.odds b{color:#B08118}
/* 十连抽的结果网格：在原来那个「盲盒方块」里铺 5 列 */
.box.wide{width:auto;height:auto;max-width:min(88vw,560px);padding:12px;border-radius:18px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;animation:none}
.box.wide .tc{position:relative;background:rgba(255,253,248,.94);border:1.5px solid var(--line);
  border-radius:12px;padding:4px 2px 2px;opacity:0;transform:scale(.5);
  transition:all .32s cubic-bezier(.2,1.4,.4,1)}
.box.wide .tc.on{opacity:1;transform:scale(1)}
.box.wide .tc canvas{width:100%;aspect-ratio:1;display:block}
.box.wide .tc .rn{font-size:9px;text-align:center;display:block;font-weight:700}
.box.wide .tc.rare{border-color:#9DB8F0;background:linear-gradient(180deg,#F2F6FF,#E4EDFC)}
.box.wide .tc.legend{border-color:#E2C072;background:linear-gradient(180deg,#FFF8E2,#FFEFC2)}
.btn.ad{background:linear-gradient(180deg,#A9D8C3,#6FB894);border-color:#5AA37F;color:#fff}
.btn small{display:block;font-size:9.5px;font-weight:500;opacity:.8}
.btn .cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,253,248,.86);border-radius:999px;font-size:11px;color:#94806E}

/* 盲盒开箱动画 */
.drawWrap{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(88,66,54,.5);backdrop-filter:blur(4px);animation:fadeIn .2s}
.box{width:170px;height:170px;border-radius:26px;background:#FFFDF8;border:3px dashed #E7D8C6;
  display:flex;align-items:center;justify-content:center;position:relative;
  animation:boxShake .5s ease-in-out infinite}
@keyframes boxShake{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.05)}}
/* 大屏（平板 / 折叠屏 / 宽视口）：460px 的上限会让两侧空一大片、
   棋盘显小。放宽到 640px，棋盘宽度、字号跟着吃满 */
@media (min-width: 480px){
  .app{width:min(100vw,640px)}
  .sheet{width:min(92vw,640px)}
  .top .pill b{font-size:22px}
  .top .pill small{font-size:11px}
  .workHead .wk small{font-size:11px}
  .workHead .wk b{font-size:22px}
  .workHead .wk .goalRow canvas{width:26px;height:26px}
  .nav button{font-size:13px}
}
.box.pop{animation:boxPop .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes boxPop{0%{transform:scale(1)}55%{transform:scale(1.24)}100%{transform:scale(1);border-style:solid}}
.box canvas{width:78%;height:78%;display:block}
.drawTip{position:absolute;bottom:22%;color:#fff;font-size:13px;text-shadow:0 2px 8px rgba(40,20,10,.5)}

/* 形象卡 */
.cardWrap{position:fixed;inset:0;z-index:22;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;background:rgba(40,28,22,.72);backdrop-filter:blur(5px);padding:18px}
.cardWrap img{width:min(78vw,320px);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.cardWrap p{color:rgba(255,255,255,.88);font-size:12.5px;margin:0;text-align:center;line-height:1.7}
.cardWrap .btns{display:flex;gap:9px;width:min(78vw,320px)}
.cardWrap .btns a,.cardWrap .btns button{flex:1;text-align:center;text-decoration:none;
  border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;
  border-radius:999px;padding:11px 0;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.hide{display:none!important}
.toast{position:fixed;left:0;right:0;bottom:20%;z-index:30;margin:0 auto;
  width:fit-content;max-width:min(86vw,340px);text-align:center;
  background:rgba(60,44,36,.92);color:#fff;font-size:13px;line-height:1.5;
  border-radius:16px;padding:9px 18px;
  pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

/* ---------- 视图切换 ---------- */
.app{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
.view{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px}
.pill.en b{color:#4C9179}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;
  width:min(100vw,460px);margin:0 auto;
  display:flex;gap:2px;padding:6px 8px calc(7px + env(safe-area-inset-bottom));
  background:rgba(255,251,244,.96);border-top:2px solid var(--line);
  backdrop-filter:blur(8px);box-shadow:0 -6px 18px rgba(150,118,92,.10)}
.nav button{flex:1;border:0;background:transparent;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px 0;font-size:10.5px;color:var(--ink3)}
.nav button i{font-style:normal;font-size:16px;line-height:1;color:#C2AE99}
.nav button.on{color:#C4697B}
.nav button.on i{color:#E68B9C}
.nav button .dot{position:absolute;margin-left:18px;margin-top:-2px;width:6px;height:6px;
  border-radius:50%;background:#E8657A}

/* ---------- 采胡萝卜页 ---------- */
.workHead{display:flex;gap:7px;flex:0 0 auto}
.wk{flex:1;background:rgba(255,253,248,.94);border:2px solid var(--line);border-radius:14px;
  padding:5px 4px;text-align:center;box-shadow:2px 3px 0 var(--tap)}
.wk small{display:block;font-size:9.5px;color:var(--ink3)}
.wk .goalRow{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:1px}
.wk .goalRow canvas{width:20px;height:20px;display:block}
.wk b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.boardBox{position:relative;width:100%;padding:6px;border-radius:20px;
  background:rgba(255,252,246,.86);border:2px solid var(--line);
  box-shadow:4px 5px 0 var(--tap),0 10px 24px rgba(150,118,92,.12)}
#m3{display:block;margin:0 auto;border-radius:13px;touch-action:none}

/* 连击横幅：之前完全没有样式，连击文字会挤在棋盘下方把布局撑开 */
.combo{position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;
  font-size:24px;font-weight:800;color:#fff;letter-spacing:1px;
  /* 四周描边：连击横幅压在花花绿绿的水果上，只靠投影会糊成一团 */
  text-shadow:
    -2px -2px 0 var(--pink-d), 2px -2px 0 var(--pink-d),
    -2px 2px 0 var(--pink-d), 2px 2px 0 var(--pink-d),
    0 5px 12px rgba(120,60,80,.35);
  opacity:0;transform:scale(.6)}
.combo.show{animation:comboPop .72s cubic-bezier(.2,1.5,.4,1)}
@keyframes comboPop{
  0%{opacity:0;transform:scale(.5) rotate(-6deg)}
  28%{opacity:1;transform:scale(1.16) rotate(2deg)}
  68%{opacity:1;transform:scale(1) rotate(0)}
  100%{opacity:0;transform:scale(1.1)}}

/* 兔子围观条 */
.buddyRow{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:88px}
/* 画布宽度贴着兔子收窄：原来 70 宽里兔子只占 38，右边全是空白，
   气泡被推得老远。现在 56 宽兔子占 46，比例对了，也让出 12px 给棋盘 */
#buddy{flex:0 0 56px;width:56px;height:88px;display:block}
.bubble{position:relative;flex:0 1 auto;min-width:0;max-width:100%;
  background:#FFFDF8;border:1.5px solid var(--line);border-radius:14px;
  padding:9px 12px;font-size:11.5px;line-height:1.55;color:#7A6353;
  box-shadow:2px 2px 0 var(--tap);
  transition:background .18s,border-color .18s,color .18s}
.bubble:before{content:"";position:absolute;left:-6px;top:50%;margin-top:-5px;
  width:9px;height:9px;background:#FFFDF8;border-left:1.5px solid var(--line);
  border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.bubble.pop{animation:bubblePop .36s cubic-bezier(.2,1.5,.4,1)}
@keyframes bubblePop{0%{transform:scale(.92)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
.bubble.hot{color:#C4697B;border-color:#EBCBD2;background:#FFF3F5}
.bubble.hot:before{background:#FFF3F5;border-color:#EBCBD2}

/* 结算卡片在本作里居中（theme.css 只重置了会被 .box 带偏的属性） */
.resultRow .box{text-align:center}

/* 声音开关 */
.sndRow{display:flex;align-items:center;gap:12px;margin-top:9px;
  background:rgba(255,253,248,.9);border:2px solid var(--line);border-radius:16px;padding:10px 13px}
.sndRow b{flex:1;font-size:13px;color:#5A4B42;font-weight:600}
.sndRow small{display:block;font-size:10px;color:var(--ink3);font-weight:400;margin-top:2px}
.sw{width:52px;height:30px;flex:0 0 52px;border-radius:999px;border:1.5px solid var(--line);
  background:#EFE3D4;position:relative;cursor:pointer;font-family:inherit;padding:0;
  transition:background .18s,border-color .18s}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:23px;height:23px;border-radius:50%;
  background:#FFFDF8;box-shadow:0 1px 3px rgba(120,90,70,.28);transition:transform .18s}
.sw.on{background:#F0BFC9;border-color:#E0A3B1}
.sw.on:after{transform:translateX(22px)}
.iconBtn.off{opacity:.45}

/* ---------- 通用底部弹层 ---------- */
.sheetWrap{position:fixed;inset:0;z-index:24;display:flex;align-items:flex-end;
  justify-content:center;background:rgba(88,66,54,.46);backdrop-filter:blur(4px);
  animation:fadeIn .2s}
.sheet{width:min(100vw,460px);max-height:82vh;overflow-y:auto;
  background:var(--paper);border-radius:24px 24px 0 0;border:2px solid var(--line);
  border-bottom:0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  animation:sheetUp .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet h2{margin:0 0 4px;font-size:18px;color:#4E3E36;text-align:center}
.sheet .sub{margin:0 0 14px;font-size:11.5px;color:var(--ink3);text-align:center}
.sheetClose{width:100%;margin-top:14px;border:1.5px solid #C9AE93;border-radius:999px;
  padding:11px 0;background:#FFFDF8;color:#6B5648;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit}

/* 签到 */
.signGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.signDay{position:relative;border:1.5px solid var(--line);border-radius:13px;
  padding:8px 2px 6px;text-align:center;background:rgba(255,255,252,.7)}
.signDay b{display:block;font-size:10px;color:var(--ink3);font-weight:600}
.signDay span{display:block;font-size:12px;color:#D8863C;font-weight:700;margin-top:3px}
.signDay.got{background:rgba(240,250,244,.9);border-color:#CFE2D6}
.signDay.got span{color:#5E9B7B}
.signDay.today{border-color:var(--pink);box-shadow:0 0 0 3px rgba(230,139,156,.18)}
.signDay.big{grid-column:span 2;background:rgba(255,244,228,.95);border-color:#EACDA0}

/* 转盘 */
.wheelBox{position:relative;width:min(74vw,270px);margin:6px auto 12px;aspect-ratio:1}
.wheelBox canvas{width:100%;height:100%;display:block}
.wheelPin{position:absolute;left:50%;top:-4px;transform:translateX(-50%);
  font-size:20px;color:#C4697B;text-shadow:0 2px 0 rgba(255,255,255,.9)}
.wheelTimes{display:flex;gap:8px;margin-top:4px}
.wheelTimes div{flex:1;text-align:center;font-size:11.5px;color:var(--ink3)}

/* 任务 */
.task{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;
  border:1.5px solid var(--line);background:rgba(255,255,252,.75);margin-bottom:8px}
.task .tk{flex:1;text-align:left}
.task .tk b{display:block;font-size:13px;color:#5A4B42}
.task .tk small{display:block;font-size:10.5px;color:var(--ink3);margin-top:1px}
.task .rw{font-size:11.5px;color:#D8863C;font-weight:700}
.task.done{background:rgba(240,250,244,.9);border-color:#CFE2D6}
.task .go{border:1.5px solid #C9AE93;border-radius:999px;padding:6px 14px;background:#FFFDF8;
  color:#6B5648;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.task .go[disabled]{opacity:.45}
</style>
</head>
<body>

<main class="app">
  <h1 class="sr-only">兔子的衣橱，收集服装给兔子换装并生成形象卡</h1>

  <div class="top">
    <a class="backBtn" href="../index.html" aria-label="返回游戏大厅" style="position:static">‹</a>
    <div class="pill">
      <small>胡萝卜</small><b id="carrotNum">0</b><span class="rate" id="rate">+0.2/秒</span>
    </div>
    <button class="pill en" id="btnEnergy" title="体力">
      <small>体力</small><b id="energyNum">5</b><span class="rate" id="energyTip">已满</span>
    </button>
    <div class="spacer"></div>
    <button class="iconBtn" id="btnSound" title="声音设置">♪</button>
    <button class="iconBtn" id="btnCard" title="生成形象卡">✧</button>
  </div>

  <!-- ===== 衣橱视图 ===== -->
  <section class="view" id="viewCloset">
    <div class="stage">
      <canvas id="stage"></canvas>
      <div class="stageTag" id="stageTag">在家种胡萝卜中…</div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
    <div class="actions">
      <button class="btn primary" id="btnDraw">单抽<small>30 胡萝卜</small></button>
      <button class="btn gold" id="btnDraw10">十连抽<small>270 · 必出稀有</small></button>
      <button class="btn ad" id="btnAd">免费抽<small>看广告 · 5 分钟</small></button>
    </div>
    <p class="odds">概率公示：普通 62% · 稀有 28% · 传说 10% ｜ 十连必出稀有以上</p>
  </section>

  <!-- ===== 采胡萝卜视图 ===== -->
  <section class="view hide" id="viewWork">
    <div class="workHead">
      <div class="wk"><small>剩余步数</small><b id="movesNum">20</b></div>
      <div class="wk"><small>本局收获</small><b id="gainNum">0</b></div>
      <div class="wk"><small>第 <span id="lvlNum">1</span> 关 · 目标</small>
        <span class="goalRow"><canvas id="goalIcon"></canvas><b id="goalNum">0/6</b></span></div>
    </div>
    <div class="boardBox">
      <canvas id="m3"></canvas>
      <div class="combo" id="combo"></div>
    </div>
    <!-- 兔子就站在棋盘旁边围观：气泡里的台词同时充当操作提示 -->
    <div class="buddyRow">
      <canvas id="buddy"></canvas>
      <div class="bubble" id="buddySay">拜托拜托，帮我采点胡萝卜嘛～</div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnWork">开始采胡萝卜<small>消耗 1 点体力</small></button>
      <button class="btn ad" id="btnRevive">看广告 +5 步<small>每局一次</small></button>
    </div>
  </section>

  <nav class="nav">
    <button data-view="closet" class="on"><i>◈</i>衣橱</button>
    <button data-view="work"><i>✿</i>采胡萝卜</button>
    <button id="btnSign"><i>☼</i>签到</button>
    <button id="btnWheel"><i>◎</i>转盘</button>
    <button id="btnTask"><i>✓</i>任务</button>
  </nav>
</main>

<div class="drawWrap hide" id="drawWrap">
  <div class="drawTip" id="drawTip">正在打开…</div>
  <div class="box" id="drawBox"></div>
</div>

<div class="cardWrap hide" id="cardWrap">
  <img id="cardImg" alt="兔子的形象卡">

var RARITY = [

];

var WHEEL = [

var TASKS = [

/* ============================================================
   2. 兔子与道具的画法 —— 全部是代码，没有一张图片
   坐标系：一个 100 × 132 的盒子，左上角是 (0,0)
   头中心 (50,50) 半径 30；身体中心 (50,104)
   ============================================================ */
function rr(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function ell(c, x, y, rx, ry, rot){
  c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
}
function star(c, x, y, R, r, rot){
  c.beginPath();
  for(var i = 0; i < 10; i++){
    var rad = (i % 2 === 0) ? R : r;
    var a = (rot || -Math.PI / 2) + i * Math.PI / 5;
    var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    if(i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
}

/* --- 兔子的身体 --- */
function drawBody(c, t){
  var bob = Math.sin(t * 1.6) * 1.1;      /* 轻微呼吸起伏 */
  c.save();
  c.translate(0, bob);

  /* 影子 */
  c.fillStyle = 'rgba(150,118,92,.16)';
  ell(c, 50, 130, 30, 5); c.fill();

  /* 耳朵（先画，压在头后面） */
  var sway = Math.sin(t * 1.3) * 3.2;
  c.fillStyle = '#FFF7EE'; c.strokeStyle = '#E8D5C2'; c.lineWidth = 1.6;
  c.save(); c.translate(38, 22); c.rotate(-0.19 + sway * 0.012);
  ell(c, 0, 0, 8.4, 24); c.fill(); c.stroke();
  c.fillStyle = '#F7C6CE'; ell(c, 0, 1, 3.8, 15); c.fill();
  c.restore();
  c.fillStyle = '#FFF7EE';
  c.save(); c.translate(62, 22); c.rotate(0.19 - sway * 0.012);
  ell(c, 0, 0, 8.4, 24); c.fill(); c.stroke();
  c.fillStyle = '#F7C6CE'; ell(c, 0, 1, 3.8, 15); c.fill();
  c.restore();

  /* 脚 */
  c.fillStyle = '#FFF3E6'; c.strokeStyle = '#E8D5C2'; c.lineWidth = 1.5;
  ell(c, 37, 125, 12, 6.4); c.fill(); c.stroke();
  ell(c, 63, 125, 12, 6.4); c.fill(); c.stroke();

  /* 身体 */
  c.fillStyle = '#FFFAF3'; c.strokeStyle = '#E8D5C2'; c.lineWidth = 1.6;
  ell(c, 50, 104, 29, 30); c.fill(); c.stroke();

  /* 手臂 */
  c.fillStyle = '#FFF5EA';
  ell(c, 22, 102, 8.6, 12, -0.35); c.fill(); c.stroke();
  ell(c, 78, 102, 8.6, 12, 0.35); c.fill(); c.stroke();

  c.restore();
}
function drawFace(c, mood, t){
  c.fillStyle = '#5A4B42';
  var blink = (Math.sin(t * 0.8) > 0.985) ? 0.12 : 1;   /* 偶尔眨一下眼 */
  if(mood === 'happy'){
    c.strokeStyle = '#5A4B42'; c.lineWidth = 2.4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(38, 51); c.quadraticCurveTo(42, 45, 46, 51); c.stroke();
    c.beginPath(); c.moveTo(54, 51); c.quadraticCurveTo(58, 45, 62, 51); c.stroke();
  } else {
    c.save(); c.scale(1, blink);
    ell(c, 42, 50 / (blink || 1), 3.6, 3.6); c.fill();
    ell(c, 58, 50 / (blink || 1), 3.6, 3.6); c.fill();
    c.restore();
    if(blink > 0.5){
      c.fillStyle = '#fff';
      ell(c, 40.8, 48.6, 1.3, 1.3); c.fill();
      ell(c, 56.8, 48.6, 1.3, 1.3); c.fill();
      c.fillStyle = '#5A4B42';
    }
  }
  /* 腮红 */
  c.fillStyle = 'rgba(249,200,208,.85)';
  ell(c, 31, 60, 6.4, 4.1); c.fill();
  ell(c, 69, 60, 6.4, 4.1); c.fill();
  /* 鼻子与嘴 */
  c.fillStyle = '#E9A0AC';
  ell(c, 50, 58, 2.5, 1.9); c.fill();
  c.strokeStyle = '#B98591'; c.lineWidth = 1.7; c.lineCap = 'round';
  c.beginPath();
  if(mood === 'happy'){ c.moveTo(46, 65); c.quadraticCurveTo(50, 70, 54, 65); }
  else { c.moveTo(46, 64); c.quadraticCurveTo(50, 67.4, 54, 64); }
  c.stroke();
}
function drawHead(c){
  c.fillStyle = '#FFF9F2'; c.strokeStyle = '#E8D5C2'; c.lineWidth = 1.7;
  ell(c, 50, 50, 30, 29); c.fill(); c.stroke();
}

/* --- 服装 --- */
function cloth_overall(c){          /* 背带裤 */
  c.fillStyle = '#7FA6D8';
  rr(c, 26, 92, 48, 34, 9); c.fill();
  c.fillStyle = '#6C93C6';
  rr(c, 35, 76, 7.5, 22, 3); c.fill();
  rr(c, 57.5, 76, 7.5, 22, 3); c.fill();
  c.fillStyle = '#A8C4E8';
  rr(c, 34, 104, 12, 10, 3); c.fill();      /* 口袋 */
  c.fillStyle = '#F5E9D2';
  ell(c, 40, 98, 2, 2); c.fill();
  ell(c, 60, 98, 2, 2); c.fill();
}
function cloth_stripe(c){            /* 条纹衫 */
  c.save();
  rr(c, 24, 84, 52, 30, 10); c.clip();
  c.fillStyle = '#FFF7EC'; c.fillRect(20, 80, 60, 40);
  c.fillStyle = '#E68B9C';
  for(var i = 0; i < 5; i++) c.fillRect(20, 84 + i * 7, 60, 3.6);
  c.restore();
  c.strokeStyle = '#E0CDB8'; c.lineWidth = 1.4;
  rr(c, 24, 84, 52, 30, 10); c.stroke();
}
function cloth_dress(c){             /* 小裙子 */
  c.fillStyle = '#F2A0B0';
  c.beginPath();
  c.moveTo(36, 84); c.lineTo(64, 84);
  c.quadraticCurveTo(80, 118, 72, 126);
  c.lineTo(28, 126);
  c.quadraticCurveTo(20, 118, 36, 84);
  c.closePath(); c.fill();
  c.fillStyle = '#F8C6D0';
  rr(c, 34, 82, 32, 8, 4); c.fill();
  c.fillStyle = 'rgba(255,255,255,.55)';
  ell(c, 50, 112, 3.4, 3.4); c.fill();
  ell(c, 40, 106, 2.6, 2.6); c.fill();
  ell(c, 60, 106, 2.6, 2.6); c.fill();
}
function cloth_scarf(c){             /* 围巾 */
  c.fillStyle = '#8FC7B4';
  rr(c, 28, 72, 44, 12, 6); c.fill();
  c.fillStyle = '#7BB6A2';
  rr(c, 60, 80, 13, 26, 5); c.fill();
  c.fillStyle = '#A9DCCB';
  for(var i = 0; i < 3; i++) c.fillRect(62, 96 + i * 3.4, 9, 2);
}

/* --- 帽子 --- */
function hat_strawberry(c){          /* 草莓帽 */
  c.fillStyle = '#E8657A';
  c.beginPath();
  c.moveTo(50, 4);
  c.bezierCurveTo(78, 10, 76, 32, 50, 34);
  c.bezierCurveTo(24, 32, 22, 10, 50, 4);
  c.closePath(); c.fill();
  c.fillStyle = 'rgba(255,255,255,.6)';
  ell(c, 40, 18, 2, 3, -0.4); c.fill();
  ell(c, 58, 14, 2, 3, 0.4); c.fill();
  ell(c, 50, 26, 2, 3); c.fill();
  c.fillStyle = '#7FB86A';
  for(var i = 0; i < 5; i++){
    var a = Math.PI + i * Math.PI / 4;
    c.save(); c.translate(50, 6); c.rotate(a);
    ell(c, 5, 0, 6, 2.8); c.fill();
    c.restore();
  }
}
function hat_wreath(c){              /* 花环 */
  for(var i = 0; i < 9; i++){
    var a = -Math.PI * 0.92 + i * (Math.PI * 0.84 / 8);
    var x = 50 + Math.cos(a) * 33, y = 52 + Math.sin(a) * 31;
    c.fillStyle = i % 2 ? '#7FB86A' : '#9BD186';
    ell(c, x, y, 6, 4.6, a); c.fill();
  }
  for(var j = 0; j < 5; j++){
    var a2 = -Math.PI * 0.86 + j * (Math.PI * 0.72 / 4);
    var x2 = 50 + Math.cos(a2) * 33, y2 = 52 + Math.sin(a2) * 31;
    c.fillStyle = j % 2 ? '#FBE3EC' : '#F6C6D0';
    ell(c, x2, y2, 4.2, 4.2); c.fill();
    c.fillStyle = '#F2C14E';
    ell(c, x2, y2, 1.7, 1.7); c.fill();
  }
}
function hat_night(c){               /* 睡帽 */
  c.fillStyle = '#AFC8E8';
  c.beginPath();
  c.moveTo(26, 30);
  c.quadraticCurveTo(32, -4, 62, 8);
  c.quadraticCurveTo(84, 15, 76, 26);
  c.quadraticCurveTo(52, 20, 26, 30);
  c.closePath(); c.fill();
  c.fillStyle = '#FFF9F0';
  rr(c, 24, 26, 54, 9, 4.5); c.fill();
  c.fillStyle = '#FFF9F0';
  ell(c, 78, 12, 7, 7); c.fill();
}
function hat_crown(c){               /* 小皇冠 */
  c.fillStyle = '#F2C14E';
  c.beginPath();
  c.moveTo(30, 28); c.lineTo(34, 6); c.lineTo(42, 18);
  c.lineTo(50, 2); c.lineTo(58, 18); c.lineTo(66, 6);
  c.lineTo(70, 28); c.closePath(); c.fill();
  c.fillStyle = '#D9A02C';
  rr(c, 30, 26, 40, 7, 3); c.fill();
  c.fillStyle = '#E8657A'; ell(c, 50, 29.5, 3, 3); c.fill();
  c.fillStyle = '#6C8FD8'; ell(c, 38, 29.5, 2.4, 2.4); c.fill();
  ell(c, 62, 29.5, 2.4, 2.4); c.fill();
}

/* --- 配饰 --- */
function acc_glass(c){               /* 圆眼镜 */
  c.strokeStyle = '#8A6A50'; c.lineWidth = 2.2;
  c.beginPath(); c.arc(42, 51, 9.4, 0, Math.PI * 2); c.stroke();
  c.beginPath(); c.arc(58, 51, 9.4, 0, Math.PI * 2); c.stroke();
  c.beginPath(); c.moveTo(51.4, 51); c.lineTo(48.6, 51); c.stroke();
  c.beginPath(); c.moveTo(32.6, 50); c.lineTo(26, 48); c.stroke();
  c.beginPath(); c.moveTo(67.4, 50); c.lineTo(74, 48); c.stroke();
  c.fillStyle = 'rgba(190,225,240,.35)';
  ell(c, 42, 51, 9.4, 9.4); c.fill();
  ell(c, 58, 51, 9.4, 9.4); c.fill();
}
function acc_bow(c){                 /* 蝴蝶结 */
  c.fillStyle = '#E8657A';
  c.beginPath(); c.moveTo(64, 24); c.lineTo(80, 16); c.lineTo(80, 32); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(64, 24); c.lineTo(48, 16); c.lineTo(48, 32); c.closePath(); c.fill();
  c.fillStyle = '#C74A5F';
  ell(c, 64, 24, 4.4, 4.4); c.fill();
}
function acc_star(c){                /* 小星星徽章 */
  c.save(); c.translate(72, 104); c.rotate(Math.sin(Date.now() / 700) * 0.16);
  c.fillStyle = '#F2C14E'; star(c, 0, 0, 10, 4.4); c.fill();
  c.fillStyle = '#FFF0BE'; star(c, 0, 0, 5.4, 2.4); c.fill();
  c.restore();
}
function acc_wing(c){                /* 小翅膀（画在身体后面） */
  c.fillStyle = 'rgba(255,255,255,.94)'; c.strokeStyle = '#E4D6E8'; c.lineWidth = 1.4;
  [[0, -1], [0, 1]].forEach(function(d){
    c.save(); c.translate(50 + d[1] * 26, 96); c.scale(d[1], 1);
    c.beginPath();
    c.moveTo(0, 6);
    c.quadraticCurveTo(24, -6, 30, -22);
    c.quadraticCurveTo(20, -14, 14, -14);
    c.quadraticCurveTo(20, -26, 16, -30);
    c.quadraticCurveTo(4, -14, 0, 6);
    c.closePath(); c.fill(); c.stroke();
    c.restore();
  });
}

/* --- 背景 --- */
function bg_dusk(c){
  var g = c.createLinearGradient(0, 0, 0, 132);
  g.addColorStop(0, '#FFE9C8'); g.addColorStop(0.55, '#FBD9BE'); g.addColorStop(1, '#F3C6A4');
  c.fillStyle = g; c.fillRect(0, 0, 100, 132);
  c.fillStyle = 'rgba(255,236,172,.95)';
  ell(c, 74, 26, 17, 17); c.fill();
  c.fillStyle = 'rgba(226,193,160,.75)';
  c.beginPath(); c.moveTo(0, 118); c.quadraticCurveTo(28, 100, 52, 116);
  c.quadraticCurveTo(78, 130, 100, 112); c.lineTo(100, 132); c.lineTo(0, 132);
  c.closePath(); c.fill();
}
function bg_sakura(c){
  var g = c.createLinearGradient(0, 0, 0, 132);
  g.addColorStop(0, '#FDEEF2'); g.addColorStop(1, '#F8D9E2');
  c.fillStyle = g; c.fillRect(0, 0, 100, 132);
  for(var i = 0; i < 14; i++){
    var x = (i * 37 % 100), y = (i * 53 % 132);
    c.fillStyle = i % 2 ? 'rgba(246,198,208,.85)' : 'rgba(251,227,236,.95)';
    ell(c, x, y, 4.2, 3, i); c.fill();
  }
  c.fillStyle = '#B98A96';
  c.strokeStyle = '#B98A96'; c.lineWidth = 3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, 14); c.quadraticCurveTo(40, 4, 100, 20); c.stroke();
}
function bg_night(c){
  var g = c.createLinearGradient(0, 0, 0, 132);
  g.addColorStop(0, '#2E3A5C'); g.addColorStop(1, '#5A6D96');
  c.fillStyle = g; c.fillRect(0, 0, 100, 132);
  c.fillStyle = '#FFF3D0';
  ell(c, 76, 24, 12, 12); c.fill();
  c.fillStyle = 'rgba(46,58,92,.9)';
  ell(c, 69, 20, 10, 10); c.fill();
  for(var i = 0; i < 18; i++){
    var x = (i * 41 % 100), y = (i * 29 % 110);
    c.fillStyle = 'rgba(255,255,255,' + (0.35 + (i % 3) * 0.22) + ')';
    ell(c, x, y, 1.4, 1.4); c.fill();
  }
}
function bg_grass(c){
  var g = c.createLinearGradient(0, 0, 0, 132);
  g.addColorStop(0, '#DFF0FA'); g.addColorStop(0.6, '#EAF6E8'); g.addColorStop(1, '#BFE0B0');
  c.fillStyle = g; c.fillRect(0, 0, 100, 132);
  c.fillStyle = 'rgba(255,255,255,.85)';
  ell(c, 24, 22, 14, 7); c.fill();
  ell(c, 34, 18, 10, 8); c.fill();
  c.fillStyle = '#A8D691';
  c.beginPath(); c.moveTo(0, 116); c.quadraticCurveTo(50, 100, 100, 118);
  c.lineTo(100, 132); c.lineTo(0, 132); c.closePath(); c.fill();
  c.fillStyle = '#F6C6D0';
  ell(c, 18, 122, 3.4, 3.4); c.fill();
  ell(c, 82, 124, 3, 3); c.fill();
}

/* --- 采胡萝卜棋盘上的五种萝卜（三消棋子） ---
   三消的命门是「一眼分辨」：五种棋子必须在**颜色**和**轮廓**两个维度同时拉开，
   否则每走一步都要盯着看半天，手感立刻就没了。所以：
     色相  橙 / 米白 / 紫 / 绿 / 玫红 —— 相互都隔开
     轮廓  细长锥 / 长胖柱 / 水滴 / 扁圆 / 小球 —— 互为对照
   两个维度各自都够用，色弱玩家靠轮廓也能分清。
   白萝卜的本体接近米白、和浅色底格对比很弱，全靠描边把轮廓交代出来，
   粒子的颜色也要单独给（pop），否则白色粒子在浅底上根本看不见。 */
var FRUIT = [
  { main:'#FF8C2E', light:'#FFC46E', dark:'#E56414', line:'#A34310', leaf:'#5CB83C', leafD:'#3E8F26', pop:'#E56414' },
  { main:'#FAF5E2', light:'#FFFFFF', dark:'#E6D9B4', line:'#9C7B4A', leaf:'#5CB83C', leafD:'#3E8F26', pop:'#9C7B4A' },
  { main:'#9A6AE0', light:'#C9A9F5', dark:'#7442BE', line:'#4E2A85', leaf:'#5CB83C', leafD:'#3E8F26', pop:'#7442BE' },
  { main:'#7ECB4F', light:'#B7E98D', dark:'#55A02E', line:'#34691C', leaf:'#3E8F26', leafD:'#2C6E1B', pop:'#55A02E' },
  { main:'#F2455F', light:'#FF92A8', dark:'#D01E45', line:'#8F0F2E', leaf:'#5CB83C', leafD:'#3E8F26', pop:'#D01E45' }
];

/* 五种轮廓。白萝卜要填、要裁切、要描边共三遍，单独抽出来 */
function carrotPath(c){
  c.beginPath();
  c.moveTo(-8.4, -8.5);
  c.quadraticCurveTo(-10.4, 4, 0, 13.6);
  c.quadraticCurveTo(10.4, 4, 8.4, -8.5);
  c.quadraticCurveTo(0, -12.4, -8.4, -8.5);
  c.closePath();
}
/* 白萝卜的轮廓。底部特意收成一小段细根，免得整块看成「一格空位」 */
function daikonPath(c){
  c.beginPath();
  c.moveTo(-9.4, -10);
  c.bezierCurveTo(-12.4, 1, -8.6, 10, -1.6, 13.2);
  c.quadraticCurveTo(0, 14.4, 1.6, 13.2);
  c.bezierCurveTo(8.6, 10, 12.4, 1, 9.4, -10);
  c.quadraticCurveTo(0, -14, -9.4, -10);
  c.closePath();
}
function dropPath(c){
  c.beginPath();
  c.moveTo(0, 14);

/* ============================================================
   「多汁感」的三个来源，全部代码画（参考水果消除类爆款画风）：
   1. 体积 —— 主体径向渐变，光源固定左上，全场景一致才像一套素材
   2. 高光 —— 左上亮斑，有的再加一颗小点
   3. 描边 —— 比主色深得多的轮廓线，这种画风最重的识别特征；
      白萝卜的浅色本体也全靠它立住轮廓
   ============================================================ */
function glossFill(c, pathFn, f){
  pathFn(c);
  var g = c.createRadialGradient(-4.5, -5.5, 1.5, 0, 1, 15.5);
  g.addColorStop(0, f.light);
  g.addColorStop(0.42, f.main);
  g.addColorStop(1, f.dark);
  c.fillStyle = g;
  c.fill();
}
function glossOutline(c, pathFn, f, w){
  pathFn(c);
  c.strokeStyle = f.line;
  c.lineWidth = w || 2.1;
  c.lineJoin = 'round';
  c.stroke();
}
/* 底部反光：贴着轮廓下缘内侧的一条浅色弧，让物体「坐」在光里 */
function rimLight(c, pathFn, color, cy, rx){
  c.save();
  pathFn(c); c.clip();
  c.strokeStyle = color;
  c.lineWidth = 2.8;
  c.beginPath();
  c.ellipse(0, cy, rx || 11.4, rx ? rx * 0.56 : 6.4, 0, Math.PI * 0.15, Math.PI * 0.85);
  c.stroke();
  c.restore();
}
function shine(c, x, y, rx, ry, rot, a){
  c.fillStyle = 'rgba(255,255,255,' + (a || 0.85) + ')';
  c.beginPath();
  c.ellipse(x, y, rx, ry, rot || -0.5, 0, Math.PI * 2);
  c.fill();
}
/* 叶子：渐变 + 描边 + 中脉 */
function glossyLeaf(c, x, y, rx, ry, rot, f){
  c.save();
  c.translate(x, y);
  c.rotate(rot);
  c.beginPath();
  c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  var g = c.createLinearGradient(0, -ry, 0, ry);
  g.addColorStop(0, f.leaf);
  g.addColorStop(1, f.leafD);
  c.fillStyle = g;
  c.fill();
  c.strokeStyle = f.leafD;
  c.lineWidth = 1.4;
  c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.5)';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(0, -ry * 0.6);
  c.lineTo(0, ry * 0.6);
  c.stroke();
  c.restore();
}

function drawFruit(c, kind, cx, cy, S, alpha){
  var f = FRUIT[kind] || FRUIT[0];
  var s = S / 44;
  c.save();
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.translate(cx, cy);
  c.scale(s, s);

  c.fillStyle = 'rgba(150,118,92,.14)';
  c.beginPath(); c.ellipse(0, 13, 12, 4, 0, 0, Math.PI * 2); c.fill();

  if(kind === 0){                       /* 胡萝卜：最细最长的锥形 */
    glossyLeaf(c, -4.6, -13.4, 3.2, 5.4, -0.5, f);
    glossyLeaf(c, 4.6, -13.4, 3.2, 5.4, 0.5, f);
    glossFill(c, carrotPath, f);
    rimLight(c, carrotPath, 'rgba(255,255,255,.22)', 9.5, 7.5);
    /* 萝卜特有的横向根纹 */
    c.save();
    carrotPath(c); c.clip();
    c.strokeStyle = 'rgba(163,67,16,.5)';
    c.lineWidth = 1.1; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-4.2, -2.6); c.quadraticCurveTo(-1.6, -1.6, 0.6, -2.8); c.stroke();
    c.beginPath(); c.moveTo(-2.4, 2.6); c.quadraticCurveTo(0.4, 3.8, 3, 2.4); c.stroke();
    c.restore();
    glossOutline(c, carrotPath, f);
    shine(c, -3.4, -3.4, 2.2, 3.6, -0.35, 0.8);

  } else if(kind === 1){                 /* 白萝卜：最宽的胖柱形，底部收细根 */
    /* 叶冠先画：米白身体对比弱，靠深绿叶子先交代「这是一棵菜」 */
    glossyLeaf(c, -6.4, -11.4, 3.4, 5, -0.55, f);
    glossyLeaf(c, 0, -13.2, 3.4, 5.6, 0, f);
    glossyLeaf(c, 6.4, -11.4, 3.4, 5, 0.55, f);
    glossFill(c, daikonPath, f);
    c.save();
    daikonPath(c); c.clip();
    c.strokeStyle = 'rgba(156,123,74,.5)';
    c.lineWidth = 1.1;
    [-1.5, 3.6, 8.7].forEach(function(y){
      c.beginPath(); c.moveTo(-11, y); c.quadraticCurveTo(0, y + 2.2, 11, y); c.stroke();
    });
    c.restore();
    rimLight(c, daikonPath, 'rgba(255,255,255,.45)', 13, 11);
    glossOutline(c, daikonPath, f, 2.2);
    shine(c, -5, -2, 2.6, 5.6, 0.12, 0.9);

  } else if(kind === 2){                 /* 紫萝卜：上宽下尖的水滴 + 白尖 */
    glossyLeaf(c, -3.2, -11.6, 2.9, 4.2, -0.35, f);
    glossyLeaf(c, 3.2, -11.6, 2.9, 4.2, 0.35, f);
    glossFill(c, dropPath, f);
    c.save();
    dropPath(c); c.clip();
    c.fillStyle = '#FDF8EC';
    c.fillRect(-14, 8.2, 28, 9);
    c.restore();
    glossOutline(c, dropPath, f);
    shine(c, -4.2, -2.6, 2.6, 4.2, -0.4, 0.8);

  } else if(kind === 3){                 /* 青萝卜：最宽最矮的扁圆蛋形 */
    glossyLeaf(c, -6, -9.6, 4.6, 4.2, -0.55, f);
    glossyLeaf(c, 6, -9.6, 4.6, 4.2, 0.55, f);
    glossFill(c, eggPath, f);
    rimLight(c, eggPath, 'rgba(255,255,255,.3)', 11.8, 11);
    glossOutline(c, eggPath, f);
    c.strokeStyle = 'rgba(52,105,28,.45)';
    c.lineWidth = 1.2; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-6.6, 3.4); c.lineTo(-5.2, 7.2); c.stroke();
    c.beginPath(); c.moveTo(0.6, 5.6); c.lineTo(2.2, 9.4); c.stroke();
    shine(c, -4.6, -2, 3.6, 2.4, -0.5, 0.8);

  } else {                               /* 樱桃萝卜：小球 + 细长小尾 + 两片大叶 */
    glossyLeaf(c, -4.4, -10.2, 4.4, 5.4, -0.5, f);
    glossyLeaf(c, 4.4, -10.2, 4.4, 5.4, 0.5, f);
    c.strokeStyle = f.line;
    c.lineWidth = 2.6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, 8); c.quadraticCurveTo(1.6, 12, 0, 14); c.stroke();
    glossFill(c, ballPath, f);
    rimLight(c, ballPath, 'rgba(255,255,255,.28)', 8.8, 9.2);
    glossOutline(c, ballPath, f);
    shine(c, -3.4, -4, 2.6, 1.8, -0.6, 0.9);
    shine(c, 1.8, -6.4, 1, 1, 0, 0.7);
  }
  c.restore();
}

function today(){
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

function loadSave(){
  var raw = Store.get(SAVE_KEY, null);
  if(raw && typeof raw === 'object'){
    for(var k in S){
      if(raw[k] !== undefined){
        /* 对象类型的字段做浅合并，避免旧存档缺键 */
        if(S[k] && typeof S[k] === 'object' && !(S[k] instanceof Array) && raw[k]){
          for(var k2 in raw[k]) S[k][k2] = raw[k][k2];
        } else if(raw[k] !== null){
          S[k] = raw[k];
        }
      }
    }
  }
  /* 默认送一个背景，不然展示台是空的 */
  if(S.owned.indexOf('b_dusk') < 0) S.owned.push('b_dusk');
  if(!S.worn.bg) S.worn.bg = 'b_dusk';

  /* 跨天重置：转盘次数、每日任务 */
  var t = today();
  if(S.wheelDate !== t){ S.wheelDate = t; S.wheelUsed = 0; S.wheelAdUsed = 0; }
  if(S.energyAdDate !== t){ S.energyAdDate = t; S.energyAdUsed = 0; }
  if(S.taskDate !== t){ S.taskDate = t; S.taskDone = {}; }

  recoverEnergy();
  syncBest();
}
/* 把收集进度写进全局存档，大厅卡片上就能显示「已收集 N 件」 */
function syncBest(){ Store.setBest(GAME_ID, 'collect', S.owned.length); }
function saveNow(){ S.lastTick = Date.now(); Store.set(SAVE_KEY, S); }

/* ---------- 体力：随时间恢复，是每日回访的理由 ---------- */
function recoverEnergy(){
  var now = Date.now();
  if(S.energy >= ENERGY_MAX){ S.energyAt = now; return 0; }
  var gained = Math.floor((now - S.energyAt) / (ENERGY_SEC * 1000));
  if(gained > 0){
    S.energy = Math.min(ENERGY_MAX, S.energy + gained);
    S.energyAt = now - ((now - S.energyAt) % (ENERGY_SEC * 1000));
  }
  return gained;
}
function energyIn(){
  if(S.energy >= ENERGY_MAX) return 0;
  return Math.max(0, ENERGY_SEC * 1000 - (Date.now() - S.energyAt));
}

function collectOffline(){
  var now = Date.now();
  var sec = Math.max(0, (now - S.lastTick) / 1000);
  if(sec < 30) return 0;
  sec = Math.min(sec, OFFLINE_CAP);
  var gain = Math.floor(sec * CARROT_PER_SEC);
  if(gain > 0) S.carrots += gain;
  S.lastTick = now;
  return gain;
}

var stage = $('stage'), sctx = stage.getContext('2d');
var SW = 0, SH = 0;

function resizeStage(){
  var box = stage.parentElement;
  SW = box.clientWidth; SH = box.clientHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  stage.width = Math.round(SW * dpr);
  stage.height = Math.round(SH * dpr);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', function(){ resizeStage(); drawStage(); });
window.addEventListener('orientationchange', function(){ setTimeout(function(){ resizeStage(); drawStage(); }, 250); });

/* 把兔子坐标系（100×132）映射到画布上并居中 */
function withRabbit(c, W, H, fn){
  var S2 = Math.min(W / 108, H / 142);
  c.save();
  c.translate(W / 2, H / 2);
  c.scale(S2, S2);
  c.translate(-50, -66);
  fn(c);
  c.restore();
}

function drawStage(){
  if(!SW) resizeStage();
  var t = performance.now() / 1000;
  var bgItem = itemById(S.worn.bg);
  var accItem = itemById(S.worn.acc);
  var clothItem = itemById(S.worn.cloth);
  var hatItem = itemById(S.worn.hat);

  sctx.clearRect(0, 0, SW, SH);

  /* 背景铺满整个展示台，不跟兔子的坐标缩放走 */
  if(bgItem && bgItem.fill){
    var sc = Math.max(SW / 100, SH / 132);
    sctx.save();
    sctx.translate(SW / 2, SH / 2);
    sctx.scale(sc, sc);
    sctx.translate(-50, -66);
    bgItem.draw(sctx, t);
    sctx.restore();
  } else {
    var g = sctx.createLinearGradient(0, 0, 0, SH);
    g.addColorStop(0, '#FFF7EC'); g.addColorStop(1, '#FBE8D6');
    sctx.fillStyle = g; sctx.fillRect(0, 0, SW, SH);
  }

  withRabbit(sctx, SW, SH, function(c){
    if(accItem && accItem.id === 'a_wing') accItem.draw(c, t);   /* 翅膀在身后 */
    drawBody(c, t);
    drawHead(c);
    drawFace(c, 'idle', t);
    if(clothItem) clothItem.draw(c, t);
    if(hatItem) hatItem.draw(c, t);
    if(accItem && accItem.id !== 'a_wing') accItem.draw(c, t);
    var handItem = itemById(S.worn.hand);
    if(handItem) handItem.draw(c, t);
  });
}

/* ============================================================
   6. 道具小图标
   ============================================================ */
function drawIcon(cv, item, dim){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = cv.clientWidth || 64, h = cv.clientHeight || 64;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  var c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);

  if(!item) return;
  var b = item.box;
  var pad = 4;
  var sc = Math.min((w - pad * 2) / b[2], (h - pad * 2) / b[3]);
  c.save();
  /* 未解锁的画淡一点：看得见、想要，但明显还不是你的 */
  if(dim) c.globalAlpha = 0.45;
  c.translate(w / 2, h / 2);
  c.scale(sc, sc);
  c.translate(-(b[0] + b[2] / 2), -(b[1] + b[3] / 2));
  c.save();
  c.beginPath(); c.rect(b[0], b[1], b[2], b[3]); c.clip();
  item.draw(c, performance.now() / 1000);
  c.restore();
  c.restore();
}

    return '<button data-cat="' + cat.id + '"' + (curCat === cat.id ? ' class="on"' : '') + '>' +

    b.addEventListener('click', function(){
      curCat = b.dataset.cat;
      GameAudio.unlock(); GameAudio.sfx('ui');
      renderTabs(); renderGrid();
    });
  });
}

function renderGrid(){
  var list = itemsOf(curCat);
  var html = list.map(function(it){
    var owned = S.owned.indexOf(it.id) >= 0;
    var worn = S.worn[it.cat] === it.id;

             '<canvas></canvas>' +
             '<span class="rar" style="color:' + rar.color + '">' + rar.name + '</span>' +
             '<span class="nm">' + it.name + '</span>' +
           '</div>';
  }).join('');
  $('grid').innerHTML = html;

  Array.prototype.forEach.call($('grid').querySelectorAll('.item'), function(el){
    var it = itemById(el.dataset.id);
    var owned = S.owned.indexOf(it.id) >= 0;

      saveNow();
      taskDone('dress');
      renderGrid(); drawStage(); updateStageTag();
    });
  });
}

/* ============================================================
   8. 开盲盒
   ============================================================ */
function drawablePool(){
  return ITEMS.filter(function(it){
    return S.owned.indexOf(it.id) < 0;
  });
}
function pickByRarity(pool){
  var total = 0;
  pool.forEach(function(it){ total += RARITY[it.rar].weight; });
  var roll = Math.random() * total;
  for(var i = 0; i < pool.length; i++){
    roll -= RARITY[pool[i].rar].weight;
    if(roll <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

var drawing = false;

/* 抽一件：单抽可以用稀有券（必出稀有以上），十连有自己的保底就不用券 */
function drawOnce(pool, allowTicket){
  var rarePool = pool.filter(function(it){ return it.rar >= 2; });
  var useTicket = allowTicket && S.tickets > 0 && rarePool.length > 0;
  if(useTicket) S.tickets--;
  return useTicket ? pickByRarity(rarePool) : pickByRarity(pool);
}

function openBox(free, count){
  count = count || 1;
  if(drawing) return;
  var pool = drawablePool();
  if(!pool.length){ toast('所有服装都抽齐啦，等后续新款式'); return; }
  var n = Math.min(count, pool.length);          /* 库存不足 ten 时按剩余件数收钱 */
  var each = count === 1 ? DRAW_COST : DRAW10_EACH;
  var cost = each * n;
  if(!free && S.carrots < cost){ toast('胡萝卜不够，等兔子多种一会儿'); return; }

  drawing = true;
  $('btnDraw').disabled = $('btnDraw10').disabled = true;
  if(!free){ S.carrots -= cost; saveNow(); renderCarrots(); }
  taskDone('draw');
  GameAudio.unlock();

  /* 逐件抽：同一件不会在单次抽卡里重复 */
  var results = [], left = pool.slice();
  for(var i = 0; i < n; i++){
    var got = drawOnce(left, count === 1);
    left.splice(left.indexOf(got), 1);
    results.push(got);
    S.owned.push(got.id);
    S.drawn++;
  }
  /* 十连保底：一张稀有都没有就把最后一张换成稀有的 */
  if(count > 1 && !results.some(function(it){ return it.rar >= 2; })){
    var rp = left.filter(function(it){ return it.rar >= 2; });
    if(rp.length){
      var up = pickByRarity(rp);
      var old = results.pop();
      S.owned.splice(S.owned.indexOf(old.id), 1);
      results.push(up);
      S.owned.push(up.id);
    }
  }
  /* 抽到就自动穿上稀有度最高的一件，立刻看到效果 */
  var best = results.slice().sort(function(a, b){ return b.rar - a.rar; })[0];
  S.worn[best.cat] = best.id;

  var wrap = $('drawWrap'), box = $('drawBox'), tip = $('drawTip');

  function finish(){
    wrap.classList.add('hide');
    drawing = false;
    $('btnDraw').disabled = $('btnDraw10').disabled = false;
    syncBest(); saveNow();
    renderTabs(); renderGrid(); drawStage(); updateStageTag();
    var leg = results.filter(function(it){ return it.rar >= 3; })[0];
    if(leg) toast('抽到传说款「' + leg.name + '」！');
  }

  if(count === 1){
    var got = results[0];
    box.className = 'box';
    box.innerHTML = '<canvas></canvas>';
    tip.textContent = '正在打开…';
    wrap.classList.remove('hide');

    setTimeout(function(){
      box.classList.add('pop');
      GameAudio.sfx('win');
      tip.textContent = RARITY[got.rar].name + ' · ' + got.name;
      drawIcon(box.querySelector('canvas'), got);
      if(navigator.vibrate) navigator.vibrate(got.rar >= 2 ? [30, 50, 60] : 26);
    }, 620);
    setTimeout(finish, 1900);

  } else {
    box.className = 'box wide';
    box.innerHTML = results.map(function(it){
      var cls = it.rar >= 3 ? 'legend' : it.rar === 2 ? 'rare' : '';
      return '<div class="tc ' + cls + '"><canvas></canvas>' +
             '<span class="rn" style="color:' + RARITY[it.rar].color + '">' + RARITY[it.rar].name + '</span></div>';
    }).join('');
    tip.textContent = '十连抽！正在打开…';
    wrap.classList.remove('hide');

    var cells = box.querySelectorAll('.tc');
    results.forEach(function(it, i){
      setTimeout(function(){
        cells[i].classList.add('on');
        GameAudio.sfx('pop', Math.min(9, i));
        drawIcon(cells[i].querySelector('canvas'), it);
        if(it.rar >= 2 && navigator.vibrate) navigator.vibrate(26);
      }, 320 + i * 240);
    });
    setTimeout(finish, 320 + n * 240 + 800);
  }
}

/* binder 必须和内容一起传进来：原来是在 showSheet 之后再赋 sheetBinder，

   onClose 是「无论怎么关都会执行」的收尾钩子（结算面板靠它兜住收益）。*/
var sheetBinder = null;
var sheetOnClose = null;
var sheetSeq = 0;                  /* 每次开关都自增，用来判断弹层是否还是当初那个 */

function showSheet(html, binder, onClose){
  $('sheet').innerHTML = html;
  $('sheetWrap').classList.remove('hide');
  sheetBinder = binder || null;
  sheetOnClose = onClose || null;
  sheetSeq++;
  bindSheet();
}
function closeSheet(){
  $('sheetWrap').classList.add('hide');
  sheetSeq++;
  var f = sheetOnClose;
  sheetOnClose = null;
  if(f) f();
}

function bindSheet(){
  /* 关闭按钮统一在这里绑。以前每处弹层各写一遍、结果全都漏掉了，
     「关闭」只能靠点遮罩，等于按钮是坏的 */
  Array.prototype.forEach.call($('sheet').querySelectorAll('[data-close]'), function(b){
    b.addEventListener('click', function(){
      GameAudio.sfx('ui');
      closeSheet();

/* ---------- 幸运转盘 ---------- */
var wheelAngle = 0, wheelSpinning = false;

function pickWheelIndex(){
  var total = 0;
  WHEEL.forEach(function(w){ total += w.weight; });
  var roll = Math.random() * total;
  for(var i = 0; i < WHEEL.length; i++){
    roll -= WHEEL[i].weight;
    if(roll <= 0) return i;
  }
  return 0;
}

function drawWheel(cv, angle){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = cv.clientWidth || 260;
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr);
  var c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  var R = w / 2, cx = R, cy = R;
  var seg = Math.PI * 2 / WHEEL.length;

  c.clearRect(0, 0, w, w);
  c.save();
  c.translate(cx, cy);
  c.rotate(angle);
  for(var i = 0; i < WHEEL.length; i++){
    var a0 = i * seg - Math.PI / 2 - seg / 2;
    c.beginPath();
    c.moveTo(0, 0);
    c.arc(0, 0, R - 4, a0, a0 + seg);
    c.closePath();
    c.fillStyle = WHEEL[i].color;
    c.fill();
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.5; c.stroke();

    /* 文字 */
    c.save();
    c.rotate(a0 + seg / 2);
    c.fillStyle = '#5A4B42';
    c.font = '600 ' + Math.max(9, Math.round(w * 0.038)) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    c.textAlign = 'right';
    c.textBaseline = 'middle';
    c.fillText(WHEEL[i].label, R - 16, 0);
    c.restore();
  }
  c.restore();

  /* 中心 */
  c.beginPath(); c.arc(cx, cy, w * 0.11, 0, Math.PI * 2);
  c.fillStyle = '#FFFDF8'; c.fill();
  c.strokeStyle = '#E4D3C0'; c.lineWidth = 2; c.stroke();
  c.fillStyle = '#E68B9C';
  c.font = '700 ' + Math.round(w * 0.062) + 'px "PingFang SC",sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('GO', cx, cy + 1);
}

function grantWheel(idx){

  if(w.kind === 'carrot'){ S.carrots += w.amount; toast('+' + w.amount + ' 胡萝卜'); }
  else if(w.kind === 'energy'){ S.energy = Math.min(ENERGY_MAX, S.energy + w.amount); toast('+' + w.amount + ' 点体力'); }
  else if(w.kind === 'ticket'){ S.tickets = (S.tickets || 0) + 1; toast('稀有盲盒券 +1'); }
  else if(w.kind === 'again'){ S.wheelUsed = Math.max(0, S.wheelUsed - 1); toast('再来一次！'); }
  else toast('谢谢参与，明天再来');
  saveNow(); renderCarrots(); renderEnergy(); refreshDots();

      '<button class="btn primary" style="flex:1" id="spinFree"' + (freeLeft ? '' : ' disabled') + '>免费转</button>' +
      '<button class="btn ad" style="flex:1" id="spinAd"' + (adLeft ? '' : ' disabled') + '>看广告转</button>' +
    '</div>' +
    '<button class="sheetClose" data-close="1">关闭</button>';
  showSheet(html, bindSheet);
  var cv = $('wheelCv');
  drawWheel(cv, wheelAngle);

  function spin(useAd){
    if(wheelSpinning) return;
    wheelSpinning = true;
    $('spinFree').disabled = true; $('spinAd').disabled = true;
    GameAudio.unlock();
    /* 记下当前弹层：转的过程中玩家可能已经把面板关了，
       那种情况下奖励照发，但不能再把面板弹回来 */
    var mySeq = sheetSeq;

    var idx = pickWheelIndex();
    var seg = 360 / WHEEL.length;
    /* 让指针停在第 idx 格：目标角度算出来后再多转几圈 */
    var target = -(idx * seg) + (Math.random() - 0.5) * seg * 0.6;
    var from = wheelAngle % 360;
    var delta = ((target - from) % 360 + 360) % 360 + 360 * 5;
    var dur = 2600, t0 = performance.now();

    var finished = false;
    function finish(){
      if(finished) return;
      finished = true;
      wheelSpinning = false;
      wheelAngle = ((from + delta) % 360) * Math.PI / 180;
      if(sheetSeq === mySeq) drawWheel(cv, wheelAngle);
      if(useAd) S.wheelAdUsed++; else S.wheelUsed++;
      grantWheel(idx);
      if(sheetSeq === mySeq) setTimeout(function(){ if(sheetSeq === mySeq) sheetWheel(); }, 700);
    }
    function anim(now){
      if(finished) return;
      var k = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);              /* ease-out */
      wheelAngle = (from + delta * e) * Math.PI / 180;
      drawWheel(cv, wheelAngle);
      if(k < 1) requestAnimationFrame(anim); else finish();
    }
    requestAnimationFrame(anim);
    /* 兜底：rAF 被节流（后台标签页等）时也要能结算 */
    setTimeout(finish, dur + 400);
  }

  function bindSheet(){
    $('spinFree').addEventListener('click', function(){ spin(false); });
    $('spinAd').addEventListener('click', function(){
      showAd('wheel', function(ok){ if(ok) spin(true); });
    });
  }
}

/* ============================================================
   9.5 兔子围观 —— 消除时兔子就站在棋盘旁边看着，
       连击越高、收获越多，它的反应越大
   ============================================================ */
var buddyCv = $('buddy'), bctx = buddyCv.getContext('2d');
var BW = 0, BH = 0;
var lastSay = '';

function resizeBuddy(){
  BW = buddyCv.clientWidth || 56;
  BH = buddyCv.clientHeight || 88;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  buddyCv.width = Math.round(BW * dpr);
  buddyCv.height = Math.round(BH * dpr);
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* 反应分三档：平时眨眼 → 开心跳一下 → 大反应（跳更高 + 星星） */
var buddy = {
  t: 0, cheer: 0, hop: 0, hot: 0, lean: 0,
  spark: [], milestone: 0
};

/* 兔子坐标系里它实际占的方框（耳朵尖到脚底）。
   x 特意放宽到 10~90，因为「小翅膀」这件配饰会横向伸出去，
   只框住身体的话翅膀尖会被画布切掉 */
var BUDDY_BOX = { x: 10, y: -6, w: 80, h: 140 };
var BUDDY_FOOT_PAD = 7;        /* 脚底往下留给影子的空间 */

/* 兔子穿的就是玩家在衣橱里配好的那一套。按 id 组合缓存，避免每帧遍历 24 件道具 */
var wearCache = { key:'', hat:null, cloth:null, acc:null };
function buddyWear(){
  var key = (S.worn.hat || '-') + '|' + (S.worn.cloth || '-') + '|' + (S.worn.acc || '-');
  if(key !== wearCache.key){
    wearCache.key = key;
    wearCache.hat = itemById(S.worn.hat);
    wearCache.cloth = itemById(S.worn.cloth);
    wearCache.acc = itemById(S.worn.acc);
  }
  return wearCache;
}

function buddyReset(){
  buddy.cheer = 0; buddy.hop = 0; buddy.hot = 0; buddy.lean = 0;
  buddy.spark = []; buddy.milestone = 0;
}

/* 玩家盯着棋盘不动的时候，兔子主动说一句。
   这类「被等着」的感觉比任何进度条都留人 */
var IDLE_LINES = ['慢慢想也可以的～', '我等你哦，不着急～', '要不要我帮你看看呀？'];
var idleIdx = 0, idleAt = 0;
var lastActAt = Date.now();
function buddyIdleCheck(){
  if(curView !== 'work' || !round.playing) return;
  var now = Date.now();
  if(now - lastActAt < 11000 || now - idleAt < 11000) return;
  idleAt = now;
  buddySay(IDLE_LINES[idleIdx++ % IDLE_LINES.length], false);
}

/* 台词写进气泡。quiet=true 是状态提示：内容没变就不重播动画 */
function buddySay(text, hot, quiet){
  if(!text) return;
  if(quiet && text === lastSay) return;
  lastSay = text;
  var el = $('buddySay');
  el.textContent = text;
  el.classList.toggle('hot', !!hot);
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

function spawnSpark(n){
  /* 沿兔子头顶那圈弧线生成，再往外上方飘。
     撒在脸上会遮住表情（表情是这个角色唯一的信息量），
     撒得太靠上又会直接飞出画布 —— 画布只有 56×88，能用的就头顶这一条带 */
  for(var i = 0; i < n; i++){
    var a = Math.PI * (0.12 + Math.random() * 0.76);      /* 0=右  π/2=上  π=左 */
    buddy.spark.push({
      x: BW / 2 + Math.cos(a) * BW * (0.44 + Math.random() * 0.12),
      y: BH * 0.24 - Math.sin(a) * BH * (0.1 + Math.random() * 0.08)
        + (Math.random() - 0.5) * 8,
      vx: Math.cos(a) * (18 + Math.random() * 26),
      vy: -Math.sin(a) * (8 + Math.random() * 16) - 4,
      age: 0, life: 0.6 + Math.random() * 0.35,
      r: 1.5 + Math.random() * 2.0,
      col: ['#F2C14E', '#E68B9C', '#8FCFB0', '#9DB8F0'][Math.floor(Math.random() * 4)],
      star: Math.random() < 0.45
    });
  }
  if(buddy.spark.length > 60) buddy.spark.splice(0, buddy.spark.length - 60);
}

function drawBuddy(dt){
  if(!BW || !BH) resizeBuddy();
  buddy.t += dt;
  if(buddy.cheer > 0) buddy.cheer = Math.max(0, buddy.cheer - dt);
  if(buddy.hot > 0)   buddy.hot   = Math.max(0, buddy.hot - dt);
  if(buddy.hop > 0)   buddy.hop   = Math.max(0, buddy.hop - dt * 2.6);
  buddy.lean += ((buddy.hot > 0 ? 1 : 0) - buddy.lean) * Math.min(1, dt * 8);

  bctx.clearRect(0, 0, BW, BH);

  var prog = 1 - buddy.hop;                       /* 0 → 1 */
  var amp  = buddy.hot > 0 ? 16 : 8;
  var lift = buddy.hop > 0 ? Math.sin(Math.PI * prog) * amp : 0;
  /* 缩放要按「画布高度减去脚垫」算，脚底锚在脚垫中间，
     否则整个盒子会被顶出画布顶端，耳朵就被裁掉了 */
  var sc   = Math.min(BW / BUDDY_BOX.w, (BH - BUDDY_FOOT_PAD) / BUDDY_BOX.h);
  var baseY = BH - BUDDY_FOOT_PAD / 2;
  var mood = buddy.cheer > 0 ? 'happy' : 'idle';

  /* 影子：跳起来时缩小、变淡 */
  var sh = Math.max(0.4, 1 - lift / 30);
  bctx.fillStyle = 'rgba(150,118,92,.18)';
  bctx.beginPath();
  bctx.ellipse(BW / 2, baseY + 2, 17 * sh, 3.4 * sh, 0, 0, Math.PI * 2);
  bctx.fill();

  var wear = buddyWear();
  bctx.save();
  bctx.translate(BW / 2 + buddy.lean * 3, baseY - lift);
  if(buddy.hot > 0) bctx.rotate(-0.06 * buddy.lean);
  bctx.scale(sc, sc);
  bctx.translate(-(BUDDY_BOX.x + BUDDY_BOX.w / 2), -(BUDDY_BOX.y + BUDDY_BOX.h));
  /* 穿着顺序和展示台一致：翅膀在身后，帽子最后戴 */
  if(wear.acc && wear.acc.id === 'a_wing') wear.acc.draw(bctx, buddy.t);
  drawBody(bctx, buddy.t);
  drawHead(bctx);
  drawFace(bctx, mood, buddy.t);
  if(wear.cloth) wear.cloth.draw(bctx, buddy.t);
  if(wear.hat) wear.hat.draw(bctx, buddy.t);
  if(wear.acc && wear.acc.id !== 'a_wing') wear.acc.draw(bctx, buddy.t);
  bctx.restore();

  for(var i = buddy.spark.length - 1; i >= 0; i--){
    var p = buddy.spark[i];
    p.age += dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 92 * dt;
    if(p.age >= p.life){ buddy.spark.splice(i, 1); continue; }
    bctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
    bctx.fillStyle = p.col;
    if(p.star) star(bctx, p.x, p.y, p.r * 2.2, p.r * 0.9, p.age * 4);
    else { bctx.beginPath(); bctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); }
    bctx.fill();
  }
  bctx.globalAlpha = 1;
}

/* 每次消除都会走这里：连击越高、单次消得越多，反应越大 */
function buddyCheer(info){
  lastActAt = Date.now();
  idleAt = Date.now();
  var big = info.combo >= 4 || info.cleared >= 5;
  buddy.cheer = big ? 1.5 : 0.85;
  buddy.hop = 1;
  if(big){
    buddy.hot = 1.3;
    spawnSpark(12 + Math.min(10, info.combo * 2));
    GameAudio.sfx('ding');
  } else if(info.combo >= 2){
    spawnSpark(4);
  }

  /* 收获每跨过 50 个就庆祝一次：让「分数高」也有反馈，而不只是连击 */
  var step = Math.floor(round.gained / 50);
  if(step > buddy.milestone){
    buddy.milestone = step;
    buddy.hot = Math.max(buddy.hot, 1.4);
    buddy.hop = 1;
    spawnSpark(18);
    GameAudio.sfx('ding');
    buddySay('已经 ' + round.gained + ' 个啦…真的谢谢你～', true);
    return;
  }

  if(info.combo >= 4) buddySay('哇！' + info.combo + ' 连击…我好开心呀～', true);
  else if(info.cleared >= 5) buddySay('一下这么多！眼睛都看花啦～', true);
  else if(info.combo >= 2) buddySay('连着采到了，好喜欢你～', true);
  else buddySay('谢谢你～', false, true);
}

/* ---------- 采胡萝卜（关卡制三消） ----------
   照开心消消乐的路数：指定消除目标 + 限步 + 星级 + 固定棋盘。
   难度平滑递增，每 5 关给一张稀有券，每 15 关一个新层次。 */
var m3 = null;
var round = { playing:false, gained:0, reviveUsed:false, settled:true, total:0,
              cfg:null, progress:0, movesLeft:M3_MOVES, bonus:0 };

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* 第 n 关的配置。用 n 做种子，所以每一关的萝卜种类和棋盘布局永远一样，
   输了能「复盘」，这是三消关卡的手感基础 */
function levelConfig(n){
  var rng = mulberry32(n * 7919 + 1013);
  return {
    n: n,
    kind: Math.floor(rng() * M3_KINDS),
    target: Math.min(30, 6 + Math.floor(n * 0.9)),      /* L1=6 一遍必过，之后慢慢加 */
    moves:  M3_MOVES + (n >= 8 ? 2 : 0) + (n >= 16 ? 2 : 0) + (n >= 26 ? 2 : 0)
  };
}
function updateGoalUI(){
  var cfg = round.cfg || levelConfig(S.level);
  var lvl = $('lvlNum'), num = $('goalNum');
  if(!lvl || !num) return;
  lvl.textContent = cfg.n;
  num.textContent = Math.min(round.progress, cfg.target) + '/' + cfg.target;
  var cv = $('goalIcon');
  if(cv){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(22 * dpr); cv.height = Math.round(22 * dpr);
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, 22, 22);
    drawFruit(c, cfg.kind, 11, 12, 30);
  }
}

/* 棋盘最大高度：矮屏上保证整页放得下，不会把下面的按钮挤出屏幕 */
function m3MaxHeight(){
  var v = $('viewWork');
  if(!v || !v.clientHeight) return 0;              /* 视图没显示时不做限制 */
  var fixed = 8 * 3;                               /* 三个 gap */
  ['workHead', 'buddyRow', 'actions'].forEach(function(cls){
    var el = v.querySelector('.' + cls);
    if(el) fixed += el.offsetHeight;
  });
  fixed += 6 * 2 + 4;                              /* boardBox 的 padding 与边框 */
  return Math.max(150, v.clientHeight - fixed);
}

function initM3(){
  m3 = Match3.create($('m3'), {
    cols: M3_COLS, rows: M3_ROWS, kinds: M3_KINDS, moves: M3_MOVES,
    maxHeight: m3MaxHeight,
    drawTile: drawFruit,
    /* 白萝卜的本体是米白，拿它当粒子颜色会在浅色棋盘上看不见 */
    particleColor: function(kind){
      var f = FRUIT[kind] || FRUIT[0];
      return f.pop || f.main;
    },
    sfx: function(name, n){ GameAudio.sfx(name, n); },
    /* 还没开始就点棋盘：给一句撒娇的提示，而不是静默无反应 */
    onInactiveTap: function(){ buddySay('再等一下下嘛，先点下面那个按钮～', false, true); },
    onMatch: function(info){
      round.gained += info.gain;
      $('gainNum').textContent = round.gained;
      if(round.cfg && info.kindCounts && round.playing){
        round.progress += info.kindCounts[round.cfg.kind] || 0;
        updateGoalUI();
        /* 目标达成立刻过关 —— 剩余步数折成奖励（开心消消乐同款手法） */
        if(round.progress >= round.cfg.target) levelComplete();
      }
      if(info.combo >= 2){
        var el = $('combo');
        el.textContent = '连击 x' + info.combo;
        el.classList.remove('show');
        void el.offsetWidth;
        el.classList.add('show');
      }
      buddyCheer(info);
    },
    onMove: function(left){
      round.movesLeft = left;
      $('movesNum').textContent = left;
      /* 步数快用完了给个提示 */
      if(left <= 0) buddySay('用完啦…不过没关系，这些也够我开心一阵子了', false, true);
      else if(left <= 3) buddySay('只剩 ' + left + ' 步了…还可以再来一点点吗？', false, true);
      else buddySay('滑动交换相邻的水果，三个连一起就能采到', false, true);
    },
    onEnd: function(total){ onRoundEnd(total); }
  });
  m3.setActive(round.playing && curView === 'work');
}

function setWorkBusy(playing){
  $('btnWork').disabled = playing;
  /* 续步只在一局进行中才有意义；结算面板里有单独的续步入口 */
  $('btnRevive').disabled = !playing || round.reviveUsed;
  if(m3) m3.setActive(playing && curView === 'work');
}

function startRound(){
  recoverEnergy();
  if(S.energy < 1){
    /* 别只弹一句「体力不够」就完了 —— 要当场给一个出口 */
    GameAudio.sfx('bad');
    buddySay('体力用完啦…可以等一下下，或者看个小视频？', false);
    sheetEnergy();
    return;
  }
  S.energy--;
  saveNow(); renderEnergy();
  /* 就地改字段而不是整体重新赋值，外部持有引用时才不会拿到旧对象 */
  var cfg = levelConfig(S.level);
  round.cfg = cfg;
  round.playing = true; round.gained = 0; round.reviveUsed = false;
  round.settled = false; round.total = 0;
  round.progress = 0; round.movesLeft = cfg.moves; round.bonus = 0;
  buddyReset();
  lastActAt = Date.now(); idleAt = Date.now();
  $('gainNum').textContent = 0;
  updateGoalUI();
  setWorkBusy(true);
  GameAudio.unlock();
  m3.setSeed(cfg.n * 48271 + 11);     /* 同一关，棋盘永远一样 */
  m3.start(cfg.moves);
  buddySay('第 ' + cfg.n + ' 关…帮我采 ' + cfg.target + ' 个这样的萝卜，拜托啦～', false);
  taskDone('work');
  refreshDots();
}

function onRoundEnd(total){
  round.playing = false;
  round.total = total || 0;
  setWorkBusy(false);
  /* 步数用完时目标一定还没达成（达成的瞬间就走 levelComplete 了） */
  var cfg = round.cfg || levelConfig(S.level);
  var need = Math.max(0, cfg.target - round.progress);
  GameAudio.sfx('bad');
  buddySay('就差一点点了嘛…再试一次肯定行的！', false);
  sheetRound(round.total, need);
}

/* 过关：星级按剩余步数算（开心消消乐同款），奖励立刻结清 */
function levelComplete(){
  var cfg = round.cfg;
  round.playing = false;
  setWorkBusy(false);
  m3.setActive(false);
  var left = Math.max(0, round.movesLeft);
  var star = left >= Math.ceil(cfg.moves * 0.34) ? 3
           : left >= Math.ceil(cfg.moves * 0.17) ? 2 : 1;
  var prev = S.stars[cfg.n] || 0;
  if(star > prev) S.stars[cfg.n] = star;
  S.level = cfg.n + 1;
  round.bonus = 15 + 10 * star + left * 2;      /* 每剩 1 步折 2 个胡萝卜 */
  var gotTicket = (cfg.n % 5 === 0);            /* 每 5 关送一张必出稀有的券 */
  var newTier = (cfg.n % 15 === 0);             /* 每 15 关一个新层次 */
  if(newTier) round.bonus += 100;
  if(gotTicket) S.tickets++;
  saveNow(); renderCarrots();
  GameAudio.sfx('win');
  buddy.cheer = 1.5; buddy.hop = 1.4;
  buddySay('过关啦！你也好厉害呀～', true);
  setTimeout(function(){ sheetWin(cfg, star, left, gotTicket, newTier); }, 750);
}

function sheetWin(cfg, star, left, gotTicket, newTier){
  var stars = '★★★';
  var html = '<h2>第 ' + cfg.n + ' 关 · 过关啦</h2>' +
    '<p class="starsLine"><b class="on">' + stars.slice(0, star) + '</b>' +
    '<span class="off">' + stars.slice(star) + '</span></p>' +
    '<p class="sub">采到 ' + round.progress + ' 个目标萝卜，还剩 ' + left + ' 步（每步折 2 胡萝卜）</p>' +
    '<div class="resultRow">' +
      '<div class="box"><small>本局消除</small><b>' + (round.total || m3.state().cleared) + '</b></div>' +
      '<div class="box"><small>采到</small><b>' + round.gained + '</b></div>' +
      '<div class="box"><small>过关奖</small><b>+' + round.bonus + '</b></div>' +
    '</div>' +
    (gotTicket ? '<p class="sub">每 5 关的礼物：一张<b style="color:#6C8FD8">必出稀有</b>的盲盒券！</p>' : '') +
    (newTier ? '<p class="sub">新的层次达成了！额外 +100 胡萝卜</p>' : '') +
    '<button class="btn primary" style="width:100%;margin-top:12px" id="nextLevel">下一关<small>消耗 1 点体力</small></button>' +
    '<button class="sheetClose" data-close="1">先回衣橱看看</button>';
  /* 与失败面板共用同一套兜底：不管怎么离开，这一局的收获都结清 */
  showSheet(html, bindSheet, function(){ takeRoundHarvest(false); });

  function bindSheet(){
    var nl = $('nextLevel');
    if(nl) nl.addEventListener('click', function(){
      sheetOnClose = null;
      takeRoundHarvest(false);
      closeSheet();
      startRound();
    });
  }
}

/* 收获只结算一次。所有离开结算面板的路径都必须经过这里 ——
   以前只有「收下胡萝卜」会结算，点「先去忙别的」或者点遮罩关掉，
   这一局消出来的胡萝卜就白白丢了 */
function takeRoundHarvest(loud){
  if(round.settled) return 0;
  round.settled = true;
  var g = round.gained + (round.bonus || 0);   /* 过关奖在这里一起结清 */
  S.carrots += g;
  saveNow(); renderCarrots();
  if(g > 0) toast((loud ? '收下 ' : '已收下 ') + g + ' 个胡萝卜');
  if(loud){
    GameAudio.sfx('win');
    buddySay(g > 0 ? '收到啦！我会好好收着的～' : '一颗也没有…不过还是谢谢你～', g >= 60);
  }
  return g;
}

function sheetRound(total, need){
  total = total || 0;
  var cfg = round.cfg || levelConfig(S.level);
  var html = '<h2>就差 ' + Math.max(0, need) + ' 个…</h2>' +
    '<p class="sub">第 ' + cfg.n + ' 关 · 采到 ' + round.progress + '/' + cfg.target + '，收获 ' + round.gained + ' 个胡萝卜</p>' +
    '<div class="resultRow">' +
      '<div class="box"><small>本局消除</small><b>' + total + '</b></div>' +
      '<div class="box"><small>收获</small><b>' + round.gained + '</b></div>' +
      '<div class="box"><small>目标</small><b>' + round.progress + '/' + cfg.target + '</b></div>' +
    '</div>' +
    (round.reviveUsed
      ? '<p class="sub">这一局已经续过步了</p>'
      : '<button class="btn ad" style="width:100%;margin-top:12px" id="reviveNow">看广告 +' + M3_REVIVE + ' 步，再试试</button>') +
    '<button class="btn primary" style="width:100%;margin-top:10px" id="retryLevel">再试一次<small>消耗 1 点体力 · 棋盘和刚才一模一样</small></button>' +
    '<button class="sheetClose" data-close="1">先收下胡萝卜</button>';
  /* 第三个参数是「无论怎么关都会执行」的收尾：兜住这一局的收益 */
  showSheet(html, bindSheet, function(){ takeRoundHarvest(false); });

  function bindSheet(){
    var rv = $('reviveNow');
    if(rv) rv.addEventListener('click', function(){
      showAd('revive', function(ok){
        if(!ok) return;
        round.reviveUsed = true;
        /* 续步是要接着消的，这一局还没完，所以关面板时不能结算 */
        sheetOnClose = null;
        closeSheet();
        m3.addMoves(M3_REVIVE);
        round.playing = true;
        setWorkBusy(true);
        $('gainNum').textContent = round.gained;
        buddySay('太好了…可以再陪我一会儿～', false);
      });
    });
    var rl = $('retryLevel');
    if(rl) rl.addEventListener('click', function(){
      sheetOnClose = null;
      takeRoundHarvest(false);
      closeSheet();
      startRound();          /* 体力不够时 startRound 自己会弹出补给面板 */
    });
  }
}

/* ---------- 体力补给 ----------
   每 20 分钟自动回 1 点，但等不及的时候要有个出口：这是 6 个广告点位里
   唯一一个「玩家主动想要」的，之前只有常量、没有任何入口 */
function sheetEnergy(){
  var left = Math.max(0, ENERGY_AD_MAX - (S.energyAdUsed || 0));
  var full = S.energy >= ENERGY_MAX;
  var mins = Math.ceil(energyIn() / 60000);
  var html = '<h2>体力</h2>' +
    '<p class="sub">' + (full ? '现在满满的，先去玩一会儿吧' : '再等约 ' + mins + ' 分钟会自动回 1 点') + '</p>' +
    '<div class="sndRow"><b>当前体力<small>每 20 分钟自动恢复 1 点</small></b>' +
      '<span style="font-size:22px;font-weight:700;color:#4C9179">' + S.energy + ' / ' + ENERGY_MAX + '</span></div>' +
    (!full && left > 0
      ? '<button class="btn ad" style="width:100%;margin-top:12px" id="energyAd">看广告 +' + ENERGY_AD + ' 点体力' +
        '<small>今天还能补 ' + left + ' 次</small></button>'
      : '<p class="sub" style="margin-top:14px">' + (full ? '不用补啦' : '今天的补充次数用完了，明天再来') + '</p>') +
    '<button class="sheetClose" data-close="1">' + (full ? '好的' : '等一会儿再来') + '</button>';
  showSheet(html, bindSheet);

  function bindSheet(){
    var b = $('energyAd');
    if(b) b.addEventListener('click', function(){
      showAd('energy', function(ok){
        if(!ok) return;
        S.energyAdUsed = (S.energyAdUsed || 0) + 1;
        S.energy = Math.min(ENERGY_MAX, S.energy + ENERGY_AD);
        S.energyAt = Date.now();
        saveNow(); renderEnergy(); refreshDots();
        GameAudio.sfx('win');
        toast('+' + ENERGY_AD + ' 点体力');
        sheetEnergy();          /* 立刻刷新面板，可以连续补 */
      });
    });
  }
}

/* ---------- 声音设置 ---------- */
function renderSoundBtn(){
  var off = !GameAudio.musicOn() && !GameAudio.sfxOn();
  var b = $('btnSound');
  b.classList.toggle('off', off);
  b.title = off ? '声音已关闭' : '声音设置';
}

function sheetSound(){
  var html = '<h2>声音</h2><p class="sub">音乐和音效可以分开关</p>' +
    '<div class="sndRow"><b>背景音乐<small>八音盒，实时合成，不需要联网</small></b>' +
      '<button class="sw' + (GameAudio.musicOn() ? ' on' : '') + '" id="swMusic" aria-label="背景音乐"></button></div>' +
    '<div class="sndRow"><b>音效<small>消除、开箱、按钮的声音</small></b>' +
      '<button class="sw' + (GameAudio.sfxOn() ? ' on' : '') + '" id="swSfx" aria-label="音效"></button></div>' +
    '<button class="sheetClose" data-close="1">关闭</button>';
  showSheet(html, bindSheet);

  function bindSheet(){
    $('swMusic').addEventListener('click', function(){
      GameAudio.unlock();
      var on = !GameAudio.musicOn();
      GameAudio.setMusic(on);
      this.classList.toggle('on', on);
      if(on) GameAudio.sfx('ui');
      renderSoundBtn();
    });
    $('swSfx').addEventListener('click', function(){
      var on = !GameAudio.sfxOn();
      GameAudio.setSfx(on);
      this.classList.toggle('on', on);
      GameAudio.sfx('ui');
      renderSoundBtn();
    });
  }
}

/* ---------- 体力显示 ---------- */
var lastEnergyShown = -1, lastEnergyTip = '';
function renderEnergy(){
  if(S.energy !== lastEnergyShown){ lastEnergyShown = S.energy; $('energyNum').textContent = S.energy; }
  var tip = S.energy >= ENERGY_MAX ? '已满' : Math.ceil(energyIn() / 60000) + ' 分';
  if(tip !== lastEnergyTip){ lastEnergyTip = tip; $('energyTip').textContent = tip; }
  /* 还有得补的时候给胶囊一点淡绿底，暗示这里能点 */
  $('btnEnergy').classList.toggle('can',
    S.energy < ENERGY_MAX && (S.energyAdUsed || 0) < ENERGY_AD_MAX);
}

/* ============================================================
   11. 主循环
   ============================================================ */
var lastT = performance.now();
function loop(now){
  var dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;

  if(S.carrots < 99999) S.carrots += CARROT_PER_SEC * dt;
  renderCarrots();
  if(curView === 'closet') drawStage();
  else if(curView === 'work'){ drawBuddy(dt); buddyIdleCheck(); }

  /* 体力恢复 */
  if(recoverEnergy() > 0){ saveNow(); refreshDots(); }
  renderEnergy();

  var cd = S.nextFreeDraw - Date.now();
  var btn = $('btnAd');
  var old = btn.querySelector('.cd');
  if(cd > 0){
    if(!old){
      var d = document.createElement('span');
      d.className = 'cd';
      btn.appendChild(d);
    }
    btn.querySelector('.cd').textContent = Math.ceil(cd / 1000) + ' 秒后可再抽';
  } else if(old){
    old.remove();
  }

  requestAnimationFrame(loop);
}

/* ============================================================
   12. 启动
   ============================================================ */
loadSave();
var offline = collectOffline();
if(offline > 0) toast('兔子帮你种了 ' + offline + ' 个胡萝卜');
renderTabs();
renderGrid();
renderCarrots();
renderEnergy();
resizeStage();
drawStage();
updateStageTag();
initM3();
/* 先把盘面摆好：一进采胡萝卜页看到的就是一副完整棋盘，而不是空白 */
m3.start();
m3.setActive(false);
resizeBuddy();
drawBuddy(0);
renderSoundBtn();
buddySay('拜托拜托，帮我采点胡萝卜嘛～', false, true);
updateGoalUI();
refreshDots();

/* 导航上的三个弹层 */
$('btnSign').addEventListener('click', function(){ GameAudio.unlock(); GameAudio.sfx('ui'); sheetSign(); });
$('btnWheel').addEventListener('click', function(){ GameAudio.unlock(); GameAudio.sfx('ui'); sheetWheel(); });
$('btnTask').addEventListener('click', function(){ GameAudio.unlock(); GameAudio.sfx('ui'); sheetTask(); });
$('btnWork').addEventListener('click', startRound);
$('btnSound').addEventListener('click', function(){
  GameAudio.unlock(); GameAudio.sfx('ui');
  sheetSound();
});
$('btnEnergy').addEventListener('click', function(){
  GameAudio.unlock(); GameAudio.sfx('ui');
  sheetEnergy();
});
$('btnRevive').addEventListener('click', function(){
  if(!round.playing){ toast('先点「开始采胡萝卜」嘛～'); return; }
  if(round.reviveUsed){ toast('这一局已经续过步了'); return; }
  showAd('revive', function(ok){
    if(!ok) return;
    round.reviveUsed = true;
    m3.addMoves(M3_REVIVE);
    setWorkBusy(true);
    GameAudio.sfx('ui');
    buddySay('太好了…可以再陪我一会儿～', false);
  });
});

setInterval(saveNow, 8000);
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ saveNow(); if(m3) m3.setActive(false); }
  else {
    var g = collectOffline();
    if(g > 0) toast('又种了 ' + g + ' 个胡萝卜');
    saveNow();
    if(m3) m3.setActive(round.playing && curView === 'work');
  }
});
/* 屏幕尺寸变了要重算棋盘与兔子 */
window.addEventListener('resize', function(){
  if(m3) m3.resize();
  resizeBuddy();
});
window.addEventListener('orientationchange', function(){
  setTimeout(function(){ if(m3) m3.resize(); resizeBuddy(); }, 250);
});

GameAudio.autoUnlock();
requestAnimationFrame(loop);

/* 给自动化测试留的钩子 */
window.__closet = {
  state: function(){
    return {
      carrots: Math.floor(S.carrots),
      energy: S.energy,
      owned: S.owned.length,
      total: ITEMS.length,
      worn: S.worn,
      drawn: S.drawn,
      tickets: S.tickets || 0,
      signDay: S.signDay,
      wheelUsed: S.wheelUsed,
      wheelAdUsed: S.wheelAdUsed,
      taskDone: S.taskDone,
      bestRound: S.bestRound,
      view: curView,
      round: round
    };
  },
  S: S,
  levelInfo: function(){
    var cfg = round.cfg || levelConfig(S.level);
    return { n: cfg.n, kind: cfg.kind, target: cfg.target, moves: cfg.moves,
             progress: round.progress, bonus: round.bonus, stars: S.stars, level: S.level };
  },
  openBox: openBox,
  giveCarrots: function(n){ S.carrots += n; saveNow(); renderCarrots(); },
  setEnergy: function(n){ S.energy = n; S.energyAt = Date.now(); saveNow(); renderEnergy(); },
  switchView: switchView,
  startRound: startRound,
  takeHarvest: takeRoundHarvest,
  /* 棋子配色：给人眼可辨性做自动化校验用 */
  palette: function(){ return FRUIT.map(function(f){ return { main:f.main, dark:f.dark, line:f.line, pop:f.pop || f.main }; }); },
  energy: function(){ return { used: S.energyAdUsed || 0, max: ENERGY_AD_MAX, add: ENERGY_AD }; },
  tickBuddy: function(dt){ resizeBuddy(); drawBuddy(dt || 1 / 60); return BW + 'x' + BH; },
  closeSheet: closeSheet,
  sheetOpen: function(){ return !$('sheetWrap').classList.contains('hide'); },
  sheetText: function(){ return $('sheet').textContent; },
  sheets: { sign: sheetSign, wheel: sheetWheel, task: sheetTask, round: sheetRound, sound: sheetSound },
  buddyCheer: function(info){ buddyCheer(info || { combo:1, cleared:3, gain:3 }); },
  buddy: function(){
    return {
      cheer: buddy.cheer, hop: buddy.hop, hot: buddy.hot,
      spark: buddy.spark.length, milestone: buddy.milestone,
      say: $('buddySay').textContent,
      hotClass: $('buddySay').classList.contains('hot')
    };
  },
  spinWheel: function(){ sheetWheel(); },
  openSign: sheetSign,
  openTask: sheetTask,
  m3: function(){ return m3; },
  round: round,
  render: function(){ renderTabs(); renderGrid(); drawStage(); updateStageTag(); }
};
})();
</script>
</body>
